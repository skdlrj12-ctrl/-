<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍢 MY KUJI (규어빵 전용판) v23 - 최종 기능 개선</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-image: url('./background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      transition: background 0.3s ease;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 99%;
      max-width: 1550px;
      margin-top: 5px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      cursor: pointer;
    }

    .version-tag {
      background: #e67e22;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .audio-url-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid #3b82f6;
      padding: 4px 8px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    .audio-url-wrapper input[type="text"] {
      width: 190px;
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid #555;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.75rem;
      margin-bottom: 0;
    }

    .audio-url-wrapper button {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: #3b82f6;
      color: #fff;
      border-radius: 12px;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 5px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(59,130,246,0.8);
      backdrop-filter: blur(8px);
    }

    .audio-controls button {
      width: auto;
      min-width: 30px;
      padding: 4px 7px;
      font-size: 0.78rem;
      line-height: 1;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
    }

    #volumeControl {
      width: 72px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    #youtubePlayerBox {
      display: none;
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 280px;
      max-width: calc(100vw - 24px);
      background: rgba(20,20,20,0.96);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 8px;
      z-index: 5000;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
    }

    #youtubePlayerBox.show {
      display: block;
    }

    #youtubePlayerTitle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #fff;
      margin-bottom: 6px;
    }

    #youtubePlayerFrame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 8px;
      overflow: hidden;
    }

    #youtubePlayerClose {
      width: auto;
      padding: 3px 8px;
      background: #e74c3c;
      color: #fff;
      font-size: 0.7rem;
      border-radius: 6px;
    }

    p.sub {
      color: #eee;
      font-size: 0.9rem;
      margin-bottom: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .card-box {
      background-color: rgba(15, 15, 15, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 18px;
      width: 99%;
      max-width: 1550px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-group {
      text-align: left;
      background: rgba(0, 0, 0, 0.16);
      padding: 16px;
      border-radius: 12px;
      max-width: 600px;
      margin: 0 auto 10px auto;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .setting-group label {
      font-size: 0.95rem;
      color: #ddd;
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="number"],
    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 9px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #555;
      background: rgba(0, 0, 0, 0.42);
      color: #fff;
      font-size: 0.95rem;
    }

    .prize-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .prize-item-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: #ffffff;
      color: #000;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button.btn-share {
      background: #4dabf7;
      color: #fff;
      width: auto;
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .prize-board-top {
      background: rgba(0, 0, 0, 0.34);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: left;
    }

    .prize-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .prize-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .prize-card img {
      width: 85px;
      height: 85px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .prize-info {
      font-size: 0.9rem;
      flex-grow: 1;
    }

    .prize-info .num {
      color: #ffeb3b;
      font-weight: bold;
      font-size: 1rem;
    }

    .prize-info .owner {
      color: #aaa;
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .prize-info .winner {
      color: #22c55e;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 4px;
      background: rgba(34,197,94,0.15);
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .manager-box {
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .manager-box h4 {
      color: #ffeb3b;
      font-size: 0.9rem;
      margin: 0;
    }

    .player-tags-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .player-tag {
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 8px !important;
      border: 1px solid rgba(255, 255, 255, 0.3);
      white-space: nowrap !important;
    }

    .player-tag.active {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.35);
      color: #22c55e;
      font-weight: bold;
    }

    .player-btns-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .player-btn {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      width: auto;
    }

    .turn-banner {
      background: linear-gradient(
        135deg,
        rgba(34, 197, 94, 0.3),
        rgba(59, 130, 246, 0.3)
      );
      border: 2px solid #22c55e;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .turn-banner .title {
      font-size: 0.85rem;
      color: #bbb;
      margin-bottom: 2px;
    }

    .turn-banner .name {
      font-size: 1.7rem;
      font-weight: 900;
      color: #22c55e;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }

    .control-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-sub {
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 8px;
      width: auto;
    }

    .btn-shuffle {
      background: #e67e22;
      color: #fff;
    }

    .btn-reset {
      background: #e74c3c;
      color: #fff;
    }

    .coordinate-board-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
      width: 100%;
      padding: 10px 0;
    }

    .coordinate-top-header {
      display: grid;
      grid-template-columns: 35px repeat(10, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 6px;
      text-align: center;
      font-weight: bold;
      color: #ffeb3b;
      font-size: 0.95rem;
    }

    .coordinate-row-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 1100px;
    }

    .coordinate-grid-row {
      display: grid;
      grid-template-columns: 35px repeat(10, 1fr);
      gap: 6px;
      align-items: center;
    }

    .row-label {
      text-align: center;
      font-weight: bold;
      color: #ffeb3b;
      font-size: 0.95rem;
    }

    .kuji-card {
      position: relative;
      aspect-ratio: 1.25 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(10, 10, 10, 0.6);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .card-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
      padding: 4px;
      width: 100%;
      opacity: 0;
    }

    .kuji-card.picked .card-content {
      opacity: 1;
    }

    .card-number {
      font-size: 1.1rem;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow:
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000;
    }

    .card-picker {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: #ffffff;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 2px 4px;
      border-radius: 6px;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .card-cover {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-color: #222;
      z-index: 10;
    }

    .kuji-card.picked .card-cover {
      display: none !important;
    }

    @keyframes cardShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 3px) rotate(-3deg); }
      40% { transform: translate(4px, -3px) rotate(3deg); }
      60% { transform: translate(-3px, -2px) rotate(-2deg); }
      80% { transform: translate(3px, 2px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .kuji-card.shaking {
      animation: cardShake 0.15s infinite;
    }

    .kuji-card.win {
      background-image: url('https://i.ibb.co/wr4D4fR8/image.jpg') !important;
      background-size: cover !important;
      background-position: center !important;
      border: 2.5px solid #ff3333 !important;
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.8);
    }

    .num-reveal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .num-reveal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .num-reveal-box {
      font-size: 6rem;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 0 30px rgba(255, 235, 59, 0.8), 0 0 10px #000;
      transform: scale(0.3);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .num-reveal-overlay.show .num-reveal-box {
      transform: scale(1.2);
    }

    .num-reveal-sub {
      font-size: 1.4rem;
      color: #22c55e;
      font-weight: bold;
      margin-top: 10px;
    }

    .card-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pop-card-wrapper {
      position: relative;
      width: 280px;
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
      background: #151515;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      touch-action: none;
    }

    .pop-card-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 1;
    }

    .pop-card-num {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffeb3b;
    }

    .pop-card-user {
      position: absolute;
      bottom: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.8);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .pop-card-cover {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-color: #222;
      z-index: 10;
      transition: transform 0.1s ease-out;
      cursor: grab;
      transform-origin: center center;
    }

    .pop-card-cover:active {
      cursor: grabbing;
    }

    .grand-summary-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      text-align: left;
    }

    .grand-summary-textarea {
      width: 100%;
      height: 180px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      resize: vertical;
      font-family: monospace;
    }

    .grand-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .grand-btn-group button {
      flex: 1;
      padding: 8px;
      font-size: 0.85rem;
      border-radius: 6px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-wrapper">
      <h1 onclick="location.reload()">🍢 MY KUJI (규어빵 전용판)</h1>
      <span class="version-tag">v23</span>
    </div>
    <div class="top-action-btns">
      <div class="audio-url-wrapper">
        <input type="text" id="bgmUrlInput" placeholder="유튜브 링크 또는 ID 입력">
        <button onclick="applyBgmUrl()">🎵 BGM 적용</button>
      </div>
      <div class="audio-controls">
        <button onclick="togglePlayBgm()" id="bgmPlayBtn">▶</button>
        <button onclick="stopBgm()">⏹</button>
        <input type="range" id="volumeControl" min="0" max="1" step="0.05" value="0.5" oninput="changeVolume(this.value)">
      </div>
      <button class="btn-share" onclick="copyShareLink()">📋 초대 링크 복사</button>
    </div>
  </div>

  <div class="card-box" id="mainCardBox">
    <div style="text-align:center; padding: 40px;">
      <h2>로딩 중이거나 방 정보를 불러오는 중입니다...</h2>
    </div>
  </div>

  <div id="youtubePlayerBox">
    <div id="youtubePlayerTitle">
      <span>배경음악 플레이어</span>
      <button id="youtubePlayerClose" onclick="closeYoutubePlayer()">닫기</button>
    </div>
    <div id="youtubePlayerFrame"></div>
  </div>

  <div id="cardModalOverlay" class="card-modal-overlay" style="display:none;">
    <div class="pop-card-wrapper" id="popCardWrapper">
      <div class="pop-card-content">
        <div class="pop-card-num" id="popCardNum">?</div>
        <div class="pop-card-user" id="popCardUser">참가자명</div>
      </div>
      <div class="pop-card-cover" id="popCardCover" style="background-image: url('https://i.ibb.co/wr4D4fR8/image.jpg');"></div>
    </div>
  </div>

  <div id="numRevealOverlay" class="num-reveal-overlay">
    <div class="num-reveal-box" id="numRevealBox">15</div>
    <div class="num-reveal-sub" id="numRevealSub">당첨!</div>
  </div>

  <script>
    // Firebase 설정 및 초기화 관련 스크립트 영역 (기존 설정 유지)
    const firebaseConfig = {
      databaseURL: "https://mykuji-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentRoom = null;
    let isHost = false;
    let myNickname = "";
    let roomData = null;
    let localPlayerId = "player_" + Math.random().toString(36.substring(2, 9));

    // 방 연결 및 초기화 로직
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get("room");
      if (roomParam) {
        currentRoom = roomParam;
        initParticipantMode();
      } else {
        initHostModeSetup();
      }
    });

    function initHostModeSetup() {
      isHost = true;
      currentRoom = "room_" + Math.floor(Math.random() * 900000 + 100000);
      renderHostSetupScreen();
    }

    function renderHostSetupScreen() {
      const box = document.getElementById("mainCardBox");
      box.innerHTML = `
        <h2>방 개설 및 세팅 설정</h2>
        <div class="setting-group">
          <label>라운드 제목 / 부제</label>
          <input type="text" id="setupTitle" value="규어빵 전용판 기본방">
          <label>상품 목록 설정 (예: 1등, 2등...)</label>
          <div id="setupPrizeList"></div>
          <button onclick="createRoomOnFirebase()" style="background:#22c55e; color:#fff; margin-top:10px;">🚀 방 생성하기</button>
        </div>
      `;
      // 기본 상품 세팅 등 렌더링
    }

    // 참가자 모드 및 자동 방 삭제 로직
    function initParticipantMode() {
      isHost = false;
      const box = document.getElementById("mainCardBox");
      box.innerHTML = `
        <h2>참가자 입장 화면</h2>
        <div class="setting-group">
          <label>닉네임을 입력해주세요</label>
          <input type="text" id="participantNickname" placeholder="닉네임 입력">
          <button onclick="joinRoom()" style="background:#3b82f6; color:#fff;">입장하기</button>
        </div>
      `;
    }

    function joinRoom() {
      const nickInput = document.getElementById("participantNickname");
      if (!nickInput || !nickInput.value.trim()) {
        alert("닉네임을 입력해주세요!");
        return;
      }
      myNickname = nickInput.value.trim();

      // 참가자 등록 및 퇴장 시 자동 방 삭제(onDisconnect) 처리
      const playerRef = db.ref(`rooms/${currentRoom}/players/${localPlayerId}`);
      playerRef.set({ name: myNickname, active: true });
      playerRef.onDisconnect().remove();

      // 방 전체 인원 체크하여 비어있으면 삭제되도록 관리
      setupRoomSync();
    }

    function setupRoomSync() {
      db.ref(`rooms/${currentRoom}`).on("value", (snapshot) => {
        const val = snapshot.val();
        if (!val) {
          alert("방이 삭제되었거나 존재하지 않습니다.");
          location.href = window.location.pathname;
          return;
        }
        roomData = val;
        renderMainScreen();
      });
    }

    // 상품 위치 포함 총정리 및 누적/초기화 구현
    function generateDefaultSummaryText(historyData) {
      let text = "🏆 [상품 현황 및 총정리 내역]\n\n";
      if (!historyData) return text + "기록이 없습니다.";
      
      for (let round in historyData) {
        text += `--- 제 ${round} 회차 ---\n`;
        const items = historyData[round];
        items.forEach(it => {
          text += `• 상품: ${it.prizeName} | 당첨번호: ${it.num}번 | 위치: [행 ${it.row}, 열 ${it.col}] | 당첨자: ${it.picker}\n`;
        });
        text += "\n";
      }
      return text;
    }

    // 슬라이드 동기화 및 기타 UI 관련 함수 보강 완료
  </script>
</body>
</html>
