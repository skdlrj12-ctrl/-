<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍢 MY KUJI v5.0 (규어빵 전용판)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-top: 10px; font-size: 2rem; display: flex; align-items: center; gap: 8px; text-align: center; }
    p.sub { color: #888; font-size: 1rem; margin-bottom: 25px; }
    .card-box { background-color: #1e1e1e; border-radius: 16px; padding: 24px; width: 95%; max-width: 1200px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    .setting-group { text-align: left; background: #2a2a2a; padding: 18px; border-radius: 12px; margin-bottom: 15px; max-width: 500px; margin-left: auto; margin-right: auto; }
    .setting-group label { font-size: 0.95rem; color: #aaa; display: block; margin-bottom: 6px; }
    input[type="number"], input[type="text"] { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; text-align: center; font-size: 1.1rem; }
    button { width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold; border-radius: 8px; border: none; background: #ffffff; color: #000; cursor: pointer; margin-bottom: 8px; transition: all 0.2s; }
    button:active { opacity: 0.8; }
    button.btn-share { background: #4dabf7; color: #fff; margin-top: 8px; max-width: 250px; text-align: center; }
    
    .control-btns { display: flex; gap: 12px; margin-bottom: 15px; justify-content: center; }
    .btn-sub { font-size: 1rem; padding: 12px 20px; border-radius: 8px; width: auto; min-width: 160px; }
    .btn-slow { background: #333; color: #aaa; border: 1px solid #555; }
    .btn-slow.active { background: #f39c12; color: #fff; border-color: #f39c12; font-weight: bold; }
    .btn-random { background: #8e44ad; color: #fff; }
    
    .room-info { background: #2a2a2a; padding: 16px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
    .room-code { color: #4dabf7; font-size: 1.4rem; letter-spacing: 1px; font-weight: bold; }
    
    .players-order { margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; font-size: 0.95rem; color: #ddd; word-break: break-all; }
    .host-tag { color: #f39c12; font-weight: bold; }

    .order-controls { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .order-item { background: #1a1a1a; padding: 4px 10px; border-radius: 6px; display: flex; align-items: center; gap: 6px; border: 1px solid #444; font-size: 0.85rem; }
    .btn-move { background: #444; color: #fff; border: none; padding: 2px 6px; font-size: 0.75rem; border-radius: 4px; cursor: pointer; margin: 0; width: auto; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 15px; }
    
    .kuji-card { 
      position: relative; 
      aspect-ratio: 1 / 1.3; 
      border-radius: 10px; 
      overflow: hidden; 
      background: #222; 
      touch-action: none; 
      cursor: pointer; 
      border: 1px solid #333; 
      isolation: isolate; 
    }
    .card-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; }
    .card-number { font-size: 2rem; font-weight: 900; color: #ffeb3b; letter-spacing: -0.5px; }
    .card-picker { font-size: 0.9rem; color: #4dabf7; font-weight: bold; margin-top: 4px; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 12px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .card-cover { 
      position: absolute; 
      inset: 0; 
      background-size: cover; 
      background-repeat: no-repeat;
      background-position: center top; 
      background-color: #1a1a1a; 
      z-index: 10; 
      transition: transform 0.12s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.12s ease; 
      cursor: grab; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.6); 
      transform-origin: left center;
      touch-action: none;
      will-change: transform;
    }
    .card-cover::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, rgba(0,0,0,0.4) 0%, rgba(255,255,255,0.05) 50%, rgba(0,0,0,0.3) 100%);
      pointer-events: none;
    }
    .kuji-card.dragging { z-index: 100; overflow: visible; }
    .kuji-card.picked .card-cover { display: none; }
    .kuji-card.picked { border: 1px solid #555; background: #181818; }
    .kuji-card.win { background: #e74c3c !important; border-color: #ff6b6b; }
    .kuji-card.win .card-number { color: #fff !important; font-size: 2rem; font-weight: 900; }
    .hidden { display: none; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>🍢 MY KUJI (규어빵 전용판)</h1>
  <p class="sub">실시간 제비뽑기 게임 v5.0</p>

  <div id="lobby" class="card-box">
    <div class="setting-group">
      <label>0. 내 이름 (닉네임)</label>
      <input type="text" id="userNameInput" placeholder="이름을 입력하세요" maxlength="10">
      <label>1. 카드 총 수량 (최대 50장)</label>
      <input type="number" id="totalCardsInput" value="30" min="10" max="50">
      <label>2. 당첨 번호 (쉼표 구분)</label>
      <input type="text" id="winningNumsInput" placeholder="예: 7, 15, 23">
    </div>
    <div style="max-width: 500px; margin: 0 auto;">
      <button onclick="createRoom()" style="background: #22c55e; color: #fff;">방 만들기</button>
      <div style="color: #666; margin: 12px 0;">— 또는 —</div>
      <input type="text" id="roomInput" placeholder="방 코드 6자리 입력" maxlength="6" style="text-transform: uppercase;">
      <button onclick="joinRoom()">방 참가하기</button>
    </div>
  </div>

  <div id="game" class="card-box hidden">
    <div class="room-info">
      <div>방 코드: <span id="currentRoomCode" class="room-code"></span></div>
      <button onclick="copyShareLink()" class="btn-share">📋 방 코드 & 링크 복사</button>
      
      <div class="players-order">
        <div>👑 방장 (뜯기 권한자): <span id="hostName" class="host-tag">불러오는 중...</span></div>
        <div style="margin-top: 6px; color: #aaa;">참가자 명단: <span id="playersList"></span></div>
        <div class="order-controls" id="orderControls"></div>
      </div>
    </div>
    
    <div class="control-btns">
      <button id="slowBtn" onclick="toggleSlowMode()" class="btn-sub btn-slow active">🍦 슬라이드 뜯기: ON</button>
      <button onclick="pickRandomCard()" class="btn-sub btn-random">🎲 랜덤 뽑기</button>
    </div>
    <div id="status" style="font-size: 1.1rem; font-weight: bold; margin-bottom: 10px;">남은 카드: -장</div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    // Firebase 초기화
    const firebaseConfig = {
      apiKey: "AIzaSyCK9pczUoVYyMcckD136aW",
      authDomain: "my-kuji-4d235.firebaseapp.com",
      databaseURL: "https://my-kuji-4d235-default-rtdb.firebaseio.com",
      projectId: "my-kuji-4d235",
      storageBucket: "my-kuji-4d235.firebasestorage.app",
      messagingSenderId: "47327791417",
      appId: "1:47327791417:web:e22ef4062"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 상태 변수
    let currentRoom = null;
    let winningNumbers = [];
    let isSlowMode = true;
    let currentCardsData = [];
    let myName = "익명";
    let playersList = [];
    let hostName = "";
    let activeDragIndex = -1;

    const charImages = [
      'https://i.ibb.co/nMGG93YS/miku.jpg',
      'https://i.ibb.co/vx66H5YR/marin.jpg',
      'https://i.ibb.co/QjP9RC5F/toga.jpg'
    ];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateRoomCode() { 
      return Math.random().toString(36).substring(2, 8).toUpperCase(); 
    }

    function toggleSlowMode() {
      isSlowMode = !isSlowMode;
      const btn = document.getElementById('slowBtn');
      btn.textContent = isSlowMode ? "🍦 슬라이드 뜯기: ON" : "🍦 터치 뜯기: Direct";
      isSlowMode ? btn.classList.add('active') : btn.classList.remove('active');
    }

    function getEnteredName() {
      const input = document.getElementById('userNameInput').value.trim();
      return input ? input : "익명_" + Math.floor(Math.random() * 100);
    }

    function createRoom() {
      myName = getEnteredName();
      let total = parseInt(document.getElementById('totalCardsInput').value) || 30;
      const winInput = document.getElementById('winningNumsInput').value;
      const wins = winInput.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));
      const code = generateRoomCode();
      const numbers = shuffle(Array.from({length: total}, (_, i) => i + 1));
      
      const initialCards = numbers.map(num => ({ 
        value: num, 
        picked: false, 
        pickedBy: "", 
        slideX: 0,
        img: charImages[Math.floor(Math.random() * charImages.length)] 
      }));
      
      db.ref('rooms/' + code).set({ 
        cards: initialCards, 
        winningNumbers: wins, 
        host: myName,
        players: [myName],
        createdAt: Date.now() 
      }).then(() => enterRoom(code));
    }

    function joinRoom() {
      myName = getEnteredName();
      const code = document.getElementById('roomInput').value.trim().toUpperCase();
      db.ref('rooms/' + code).once('value', (snapshot) => { 
        if (snapshot.exists()) {
          const roomData = snapshot.val();
          let players = roomData.players || [];
          if (!players.includes(myName)) {
            players.push(myName);
            db.ref('rooms/' + code + '/players').set(players);
          }
          enterRoom(code);
        } else { 
          alert('방이 존재하지 않습니다.'); 
        } 
      });
    }

    function enterRoom(code) {
      currentRoom = code;
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('currentRoomCode').textContent = code;
      
      db.ref('rooms/' + code).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        winningNumbers = data.winningNumbers || [];
        currentCardsData = data.cards || [];
        playersList = data.players || [];
        hostName = data.host || (playersList.length > 0 ? playersList[0] : "");
        
        renderPlayersOrder();
        renderGrid(currentCardsData);
      });
    }

    function isHost() {
      return hostName && hostName.trim() === myName.trim();
    }

    function movePlayerOrder(index, direction) {
      const newIndex = index + direction;
      if (newIndex < 0 || newIndex >= playersList.length) return;
      const temp = playersList[index];
      playersList[index] = playersList[newIndex];
      playersList[newIndex] = temp;
      db.ref('rooms/' + currentRoom + '/players').set(playersList);
    }

    function renderPlayersOrder() {
      document.getElementById('hostName').textContent = hostName || "미지정";
      document.getElementById('playersList').textContent = playersList.join(' ➔ ');

      const controlsContainer = document.getElementById('orderControls');
      controlsContainer.innerHTML = '<span style="color:#aaa; font-size:0.85rem;">순서 변경: </span>';
      
      playersList.forEach((p, idx) => {
        const item = document.createElement('div');
        item.className = 'order-item';
        item.innerHTML = `
          <span>${p}</span>
          ${idx > 0 ? `<button class="btn-move" onclick="movePlayerOrder(${idx}, -1)">◀</button>` : ''}
          ${idx < playersList.length - 1 ? `<button class="btn-move" onclick="movePlayerOrder(${idx}, 1)">▶</button>` : ''}
        `;
        controlsContainer.appendChild(item);
      });
    }

    function renderGrid(cards) {
      const grid = document.getElementById('grid');
      let remainingCount = 0;

      cards.forEach((card, index) => {
        if (!card.picked) remainingCount++;
        let cardElem = document.getElementById(`kuji-card-${index}`);
        
        const isWin = card.picked && winningNumbers.includes(card.value);
        const pickerText = card.pickedBy ? `<div class="card-picker">👤 ${card.pickedBy}</div>` : '';

        if (!cardElem) {
          cardElem = document.createElement('div');
          cardElem.id = `kuji-card-${index}`;
          grid.appendChild(cardElem);
        }

        cardElem.className = 'kuji-card' + (card.picked ? ' picked' : '') + (isWin ? ' win' : '');
        cardElem.innerHTML = `
          <div class="card-content">
            <div class="card-number">${isWin ? '🔥' + card.value : card.value}</div>
            ${pickerText}
          </div>
        `;

        if (!card.picked) {
          let coverElem = cardElem.querySelector('.card-cover');
          if (!coverElem) {
            coverElem = document.createElement('div');
            coverElem.className = 'card-cover';
            coverElem.style.backgroundImage = `url('${card.img || charImages[0]}')`;
            cardElem.appendChild(coverElem);
            attachDragEvent(cardElem, coverElem, index);
          }
          if (activeDragIndex !== index) {
            const x = card.slideX || 0;
            const rot = (x / 10).toFixed(1);
            coverElem.style.transform = `translateX(${x}px) rotate(${rot}deg)`;
            coverElem.style.boxShadow = `${-x / 5}px 4px 15px rgba(0,0,0,0.6)`;
          }
        }
      });

      document.getElementById('status').textContent = `남은 카드: ${remainingCount}장`;
    }

    function attachDragEvent(cardElem, coverElem, index) {
      let startX = 0, currentX = 0, isDragging = false;
      let syncTimer = null;

      function updateSlideX(x) {
        const rot = (x / 10).toFixed(1);
        coverElem.style.transform = `translateX(${x}px) rotate(${rot}deg)`;
        coverElem.style.boxShadow = `${-x / 4}px 6px 20px rgba(0,0,0,0.7)`;

        if (!syncTimer) {
          syncTimer = setTimeout(() => {
            if (currentRoom && isDragging) {
              db.ref(`rooms/${currentRoom}/cards/${index}/slideX`).set(x);
            }
            syncTimer = null;
          }, 50);
        }
      }

      function onStart(e) {
        if (!isHost()) {
          alert(`방 만든 사람(${hostName})만 카드를 뜯을 수 있습니다!`);
          return;
        }

        if (!isSlowMode) return pickCard(index);

        e.stopPropagation();

        isDragging = true;
        activeDragIndex = index;
        cardElem.classList.add('dragging');

        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        startX = pageX - currentX;
        coverElem.style.transition = 'none';

        const moveHandler = (ev) => onMove(ev);
        const endHandler = (ev) => onEnd(ev, moveHandler, endHandler);

        window.addEventListener('touchmove', moveHandler, { passive: false });
        window.addEventListener('touchend', endHandler);
        window.addEventListener('mousemove', moveHandler);
        window.addEventListener('mouseup', endHandler);
      }

      function onMove(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        currentX = (pageX - startX) * 0.6;
        updateSlideX(currentX);
      }

      function onEnd(e, moveFn, endFn) {
        if (!isDragging) return;
        isDragging = false;
        activeDragIndex = -1;
        cardElem.classList.remove('dragging');

        window.removeEventListener('touchmove', moveFn);
        window.removeEventListener('touchend', endFn);
        window.removeEventListener('mousemove', moveFn);
        window.removeEventListener('mouseup', endFn);

        coverElem.style.transition = 'transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

        if (Math.abs(currentX) > cardElem.clientWidth * 0.35) {
          const finalX = currentX > 0 ? 350 : -350;
          updateSlideX(finalX);
          setTimeout(() => pickCard(index), 200);
        } else { 
          updateSlideX(0);
        }
        currentX = 0;
      }

      coverElem.addEventListener('touchstart', onStart, { passive: false });
      coverElem.addEventListener('mousedown', onStart);
    }

    function pickCard(index) { 
      if (!isHost()) {
        alert(`방 만든 사람(${hostName})만 카드를 뜯을 수 있습니다!`);
        return;
      }

      if (currentRoom) {
        db.ref('rooms/' + currentRoom).update({
          [`cards/${index}/picked`]: true,
          [`cards/${index}/pickedBy`]: myName,
          [`cards/${index}/slideX`]: 0
        });
      } 
    }
    
    function pickRandomCard() { 
      if (!isHost()) {
        alert(`방 만든 사람(${hostName})만 카드를 뜯을 수 있습니다!`);
        return;
      }
      const unpicked = currentCardsData.map((c, i) => c.picked ? null : i).filter(i => i !== null); 
      if (unpicked.length > 0) pickCard(unpicked[Math.floor(Math.random() * unpicked.length)]); 
    }
    
    function copyShareLink() { 
      navigator.clipboard.writeText(`https://skdlrj12-ctrl.github.io/-/`).then(() => alert('링크 복사 완료!')); 
    }
  </script>
</body>
</html>
