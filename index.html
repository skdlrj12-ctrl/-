<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎟️ MY KUJI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-top: 10px; font-size: 1.8rem; display: flex; align-items: center; gap: 8px; }
    p.sub { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    .card-box { background-color: #1e1e1e; border-radius: 16px; padding: 24px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 8px; border: 1px solid #333; background: #2a2a2a; color: #fff; text-align: center; font-size: 1.1rem; text-transform: uppercase; }
    button { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; background: #ffffff; color: #000; cursor: pointer; margin-bottom: 10px; transition: opacity 0.2s; }
    button:active { opacity: 0.8; }
    .room-info { background: #2a2a2a; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-weight: bold; letter-spacing: 1px; color: #4dabf7; }
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
    .kuji-btn { aspect-ratio: 1; border-radius: 8px; border: none; background: #2b2b36; color: #fff; font-size: 1rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0; }
    .kuji-btn.picked { background: #444; color: #888; cursor: not-allowed; text-decoration: line-through; }
    .hidden { display: none; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>🎟️ MY KUJI</h1>
  <p class="sub">30장의 쿠지를 함께 뽑아보세요</p>

  <!-- 메인 대기실 화면 -->
  <div id="lobby" class="card-box">
    <button onclick="createRoom()">방 만들기</button>
    <div style="color: #666; margin: 10px 0;">또는</div>
    <input type="text" id="roomInput" placeholder="방 코드 입력" maxlength="6">
    <button onclick="joinRoom()">방 참가하기</button>
  </div>

  <!-- 게임 진행 화면 -->
  <div id="game" class="card-box hidden">
    <div class="room-info">방 코드: <span id="currentRoomCode"></span></div>
    <div id="status">남은 카드: 30장</div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    // Firebase 연동 설정
    const firebaseConfig = {
      apiKey: "AIzaSyCK9pczUoVYyMcckD136aW",
      authDomain: "my-kuji-4d235.firebaseapp.com",
      databaseURL: "https://my-kuji-4d235-default-rtdb.firebaseio.com",
      projectId: "my-kuji-4d235",
      storageBucket: "my-kuji-4d235.firebasestorage.app",
      messagingSenderId: "47327791417",
      appId: "1:47327791417:web:e22ef4062"
    };

    // Firebase 초기화
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let currentRoom = null;

    // 랜덤 방 코드 생성 (6자리)
    function generateRoomCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // 방 만들기
    function createRoom() {
      const code = generateRoomCode();
      const initialCards = Array(30).fill(false); // 30장 (false: 안 뽑힘)

      db.ref('rooms/' + code).set({
        cards: initialCards,
        createdAt: Date.now()
      }).then(() => {
        enterRoom(code);
      }).catch((err) => {
        alert('방 생성 오류: Database 규칙 설정을 확인해 주세요.');
      });
    }

    // 방 참가하기
    function joinRoom() {
      const code = document.getElementById('roomInput').value.trim().toUpperCase();
      if (!code) return alert('방 코드를 입력하세요.');

      db.ref('rooms/' + code).once('value', (snapshot) => {
        if (snapshot.exists()) {
          enterRoom(code);
        } else {
          alert('존재하지 않는 방 코드입니다.');
        }
      });
    }

    // 게임방 입장 및 실시간 동기화
    function enterRoom(code) {
      currentRoom = code;
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('currentRoomCode').textContent = code;

      // 실시간 데이터 변경 감지
      db.ref('rooms/' + code + '/cards').on('value', (snapshot) => {
        const cards = snapshot.val() || [];
        renderGrid(cards);
      });
    }

    // 화면 그리드 구성
    function renderGrid(cards) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      let remaining = 0;

      cards.forEach((isPicked, index) => {
        if (!isPicked) remaining++;
        const btn = document.createElement('button');
        btn.className = 'kuji-btn' + (isPicked ? ' picked' : '');
        btn.textContent = isPicked ? 'X' : (index + 1);
        btn.disabled = isPicked;
        btn.onclick = () => pickCard(index);
        grid.appendChild(btn);
      });

      document.getElementById('status').textContent = `남은 카드: ${remaining}장`;
    }

    // 카드 뽑기 (서버에 실시간 반영)
    function pickCard(index) {
      if (!currentRoom) return;
      db.ref('rooms/' + currentRoom + '/cards/' + index).set(true);
    }
  </script>
</body>
</html>
