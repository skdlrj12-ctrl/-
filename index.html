<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍢 MY KUJI (규어빵 전용판) v7</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    
    body { 
      background-image: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url('https://i.ibb.co/d0qnQSCq/image.jpg'); 
      background-size: cover; background-position: center; background-repeat: no-repeat; background-attachment: fixed;
      color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 15px; 
    }
    
    .header-bar { display: flex; justify-content: space-between; align-items: center; width: 98%; max-width: 1000px; margin-top: 5px; margin-bottom: 10px; }
    .title-wrapper { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 1.5rem; text-align: center; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
    .version-tag { background: #e67e22; color: #fff; font-size: 0.8rem; font-weight: bold; padding: 2px 8px; border-radius: 12px; }
    
    .sound-btn { 
      background: rgba(0, 0, 0, 0.6); color: #ffeb3b; border: 1.5px solid #ffeb3b; 
      padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; cursor: pointer;
      display: flex; align-items: center; gap: 6px; backdrop-filter: blur(8px); width: auto;
    }
    .sound-btn.active { background: #22c55e; color: #fff; border-color: #fff; }

    p.sub { color: #eee; font-size: 0.9rem; margin-bottom: 15px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
    
    .card-box { 
      background-color: rgba(20, 20, 20, 0.45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 20px; padding: 18px; width: 98%; max-width: 1000px; 
      text-align: center; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; gap: 14px;
    }
    
    .setting-group { text-align: left; background: rgba(0, 0, 0, 0.4); padding: 16px; border-radius: 12px; max-width: 600px; margin: 0 auto 10px auto; border: 1px solid rgba(255, 255, 255, 0.15); }
    .setting-group label { font-size: 0.95rem; color: #ddd; display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="number"], input[type="text"], input[type="file"] { width: 100%; padding: 9px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #555; background: rgba(0, 0, 0, 0.6); color: #fff; font-size: 0.95rem; }
    
    .prize-item { display: flex; flex-direction: column; gap: 6px; background: rgba(0, 0, 0, 0.4); padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .prize-item-row { display: flex; gap: 8px; align-items: center; }
    .prize-item input { margin-bottom: 0; }

    button { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; background: #ffffff; color: #000; cursor: pointer; }
    button:active { opacity: 0.8; }
    button.btn-share { background: #4dabf7; color: #fff; width: auto; padding: 6px 14px; font-size: 0.85rem; }
    
    .prize-board-top { background: rgba(0, 0, 0, 0.5); padding: 14px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.2); text-align: left; }
    .prize-board-top h3 { font-size: 1.1rem; color: #ffeb3b; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 6px; }
    .prize-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    
    .prize-card { display: flex; align-items: center; gap: 14px; background: rgba(0, 0, 0, 0.7); padding: 12px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.3); }
    .prize-card img { width: 100px; height: 100px; border-radius: 8px; object-fit: cover; border: 1px solid rgba(255,255,255,0.4); flex-shrink: 0; }
    .prize-info { font-size: 1rem; }
    .prize-info .num { color: #f39c12; font-weight: bold; font-size: 1.15rem; }
    .prize-info .winner { color: #22c55e; font-weight: bold; font-size: 0.95rem; margin-top: 6px; }

    .manager-box { 
      background: rgba(0, 0, 0, 0.5); 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      border-radius: 12px; 
      padding: 10px 14px; 
      text-align: left; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      width: 100%;
    }
    .manager-box h4 { color: #ffeb3b; font-size: 0.9rem; margin: 0; }
    .player-tags-container { 
      display: flex; 
      flex-direction: row; 
      flex-wrap: wrap; 
      gap: 8px; 
      align-items: center; 
      width: 100%;
    }
    .player-tag { 
      background: rgba(0, 0, 0, 0.75); 
      padding: 6px 12px; 
      border-radius: 20px; 
      font-size: 0.85rem; 
      display: inline-flex !important; 
      flex-direction: row !important;
      align-items: center !important; 
      gap: 8px !important; 
      border: 1px solid rgba(255, 255, 255, 0.3); 
      white-space: nowrap !important;
    }
    .player-tag.active { 
      border-color: #22c55e; 
      background: rgba(34, 197, 94, 0.35); 
      color: #22c55e; 
      font-weight: bold; 
    }
    .player-btns-group { display: inline-flex; align-items: center; gap: 4px; }
    .player-btn { background: rgba(255, 255, 255, 0.25); border: none; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; cursor: pointer; width: auto; }

    .turn-banner { background: linear-gradient(135deg, rgba(34, 197, 94, 0.3), rgba(59, 130, 246, 0.3)); border: 2px solid #22c55e; border-radius: 12px; padding: 10px; text-align: center; }
    .turn-banner .title { font-size: 0.85rem; color: #bbb; margin-bottom: 2px; }
    .turn-banner .name { font-size: 1.7rem; font-weight: 900; color: #22c55e; text-shadow: 0 0 12px rgba(34, 197, 94, 0.6); }

    .control-btns { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; }
    .btn-sub { font-size: 0.85rem; padding: 8px 14px; border-radius: 8px; width: auto; }
    .btn-shuffle { background: #e67e22; color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; position: relative; }

    .kuji-card { position: relative; aspect-ratio: 1.25 / 1; border-radius: 8px; overflow: hidden; background: rgba(10, 10, 10, 0.6); cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.25); }
    .card-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 1; pointer-events: none; padding: 4px; width: 100%; opacity: 0; }
    .kuji-card.picked .card-content { opacity: 1; }

    .card-number { font-size: 1.3rem; font-weight: 900; color: #ffeb3b; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; transition: transform 0.3s ease; }
    
    .card-picker { 
      position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
      font-size: 0.75rem; color: #ffffff; font-weight: bold; background: rgba(0, 0, 0, 0.85); 
      padding: 2px 6px; border-radius: 8px; max-width: 90%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; 
      border: 1px solid rgba(255, 255, 255, 0.4); 
    }

    .card-cover { position: absolute; inset: 0; background-size: cover; background-position: center; background-color: #222; z-index: 10; }
    .kuji-card.picked .card-cover { display: none !important; }

    @keyframes cardShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 3px) rotate(-3deg); }
      40% { transform: translate(4px, -3px) rotate(3deg); }
      60% { transform: translate(-3px, -2px) rotate(-2deg); }
      80% { transform: translate(3px, 2px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }
    .kuji-card.shaking { animation: cardShake 0.15s infinite; }

    .kuji-card.win { 
      background-image: url('https://i.ibb.co/wr4D4fR8/image.jpg') !important; 
      background-size: cover !important; 
      background-position: center !important;
      border: 2.5px solid #ff3333 !important; 
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.8);
    }

    /* 개봉 시 번호 팝업 강조 연출 레이어 */
    .num-reveal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      z-index: 2000; display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .num-reveal-overlay.show { opacity: 1; pointer-events: auto; }
    .num-reveal-box {
      font-size: 6rem; font-weight: 900; color: #ffeb3b;
      text-shadow: 0 0 30px rgba(255, 235, 59, 0.8), 0 0 10px #000;
      transform: scale(0.3); transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .num-reveal-overlay.show .num-reveal-box { transform: scale(1.2); }
    .num-reveal-sub { font-size: 1.4rem; color: #22c55e; font-weight: bold; margin-top: 10px; }

    /* 카드 뜯기 모달 */
    .card-modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); z-index: 1500; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .pop-card-wrapper { position: relative; width: 280px; height: 220px; border-radius: 16px; overflow: hidden; background: #151515; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 10px 40px rgba(0,0,0,0.8); touch-action: none; }
    
    .pop-card-content { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; z-index: 1; }
    .pop-card-num { font-size: 3.5rem; font-weight: 900; color: #ffeb3b; }
    .pop-card-user { position: absolute; bottom: 12px; font-size: 1rem; font-weight: bold; color: #fff; background: rgba(0,0,0,0.8); padding: 4px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.3); }

    .pop-card-cover { 
      position: absolute; inset: 0; background-size: cover; background-position: center; background-color: #222; z-index: 10;
      transition: transform 0.1s ease-out; cursor: grab; transform-origin: center center; touch-action: none;
    }

    .modal-btn-group { display: flex; gap: 10px; margin-top: 15px; width: 280px; }
    .modal-btn-group button { font-size: 0.85rem; padding: 10px; }

    .room-info-bottom { background: rgba(0, 0, 0, 0.4); padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.15); font-size: 0.85rem; color: #aaa; }
    .room-code { color: #4dabf7; font-size: 1.1rem; font-weight: bold; }
    .hidden { display: none !important; }

    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(5, 1fr); gap: 5px; }
      .card-number { font-size: 1.0rem; }
      .prize-list-grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
      .prize-card img { width: 75px; height: 75px; }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>

<body>

      <button onclick="copyShareLink()" class="btn-share">📋 초대 링크 복사</button>

  <!-- 번호확인 강조 팝업 오버레이 -->
  <div id="numRevealOverlay" class="num-reveal-overlay">

    <div id="revealSubText" class="num-reveal-sub">지정인 : 게스트</div>
  </div>

  <div id="cardZoomModal" class="card-modal-overlay hidden">
    <div style="color: #bbb; font-size: 0.9rem; margin-bottom: 15px;">👉 슬라이드 드래그하거나 확 뜯기 버튼을 누르세요!</div>
    <div class="pop-card-wrapper">
      <div class="pop-card-content">
        <div id="zoomCardNum" class="pop-card-num">?</div>
        <div id="zoomCardUser" class="pop-card-user">-</div>
      </div>
      <div id="zoomCardCover" class="pop-card-cover"></div>
    </div>

    <div class="modal-btn-group">
      <button onclick="forceRipOpen('right')" style="background: #e74c3c; color: #fff;">💥 확 뜯기</button>
      <button onclick="reselectRandomCard()" style="background: #f39c12; color: #fff;">🔄 다시 선택</button>

  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCK9pczUoVYyMcckD136aW",
      authDomain: "my-kuji-4d235.firebaseapp.com",
      databaseURL: "https://my-kuji-4d235-default-rtdb.firebaseio.com",
      projectId: "my-kuji-4d235",
      storageBucket: "my-kuji-4d235.firebasestorage.app",
      messagingSenderId: "47327791417",
      appId: "1:47327791417:web:e22ef4062"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentRoom = null;
    let prizesData = {};
    let currentCardsData = [];
    let myName = "";
    let playersList = [];
    let hostName = "";
    let selectedIndex = null;

    // 업로드해주신 영역전개 음원 100% 전용 고정
    const WIN_SOUND_URL = 'https://pdftolink.io/file/r2_dXNlcnMvZ3Vlc3QvM2JiNTIzY2MtZWVmYi00YmY4LWFkNjMtOWZkOGQ0Mjc4NGRjLm1wMw';
    let winAudio = new Audio(WIN_SOUND_URL);
    let isMuted = false;

    // 브라우저 재생 차단 방지를 위한 초기 터치 해제 이벤트
    function unlockAudio() {
      if (winAudio) {
        winAudio.play().then(() => {
          winAudio.pause();
          winAudio.currentTime = 0;
        }).catch(() => {});
      }
      window.removeEventListener('click', unlockAudio);
      window.removeEventListener('touchstart', unlockAudio);
    }
    window.addEventListener('click', unlockAudio);
    window.addEventListener('touchstart', unlockAudio);

    function playWinSound() {
      if (isMuted) return;
      winAudio.currentTime = 0;
      winAudio.play().catch(e => console.log("음원 재생 제한: ", e));
    }

    function toggleSound() {
      isMuted = !isMuted;
      const btn = document.getElementById('soundToggleBtn');
      if (isMuted) {
        document.getElementById('soundIcon').textContent = '🔇';
        document.getElementById('soundText').textContent = '사운드 OFF';
        btn.classList.remove('active');
      } else {
        document.getElementById('soundIcon').textContent = '🔊';
        document.getElementById('soundText').textContent = '사운드 ON';
        btn.classList.add('active');
        playWinSound();
      }
    }

    const charImages = [
      'https://i.ibb.co/nMGG93YS/miku.jpg',
      'https://i.ibb.co/vx66H5YR/marin.jpg',
      'https://i.ibb.co/QjP9RC5F/toga.jpg'
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const savedName = localStorage.getItem('kuji_nickname');
      if (savedName) document.getElementById('nicknameInput').value = savedName;

      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) document.getElementById('roomInput').value = roomParam.toUpperCase();

      addPrizeInput(); addPrizeInput();
      setupZoomDrag();
    });

    function saveNickname() {
      const input = document.getElementById('nicknameInput').value.trim();
      myName = input || ("게스트_" + Math.floor(Math.random() * 1000));
      localStorage.setItem('kuji_nickname', myName);
    }

    function addPrizeInput() {
      const container = document.getElementById('prizeInputs');
      const div = document.createElement('div');
      div.className = 'prize-item';
      div.innerHTML = `
        <div class="prize-item-row">
          <input type="number" placeholder="번호" class="p-num" style="width: 70px;">
          <input type="text" placeholder="상품 이름" class="p-name">
        </div>
        <input type="file" accept="image/*" class="p-file">
      `;
      container.appendChild(div);
    }

    function compressAndReadFile(file) {
      return new Promise((resolve) => {
        if (!file) resolve('https://via.placeholder.com/150?text=Prize');
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width, height = img.height, max_size = 300;
            if (width > height) { if (width > max_size) { height *= max_size / width; width = max_size; } }
            else { if (height > max_size) { width *= max_size / height; height = max_size; } }
            canvas.width = width; canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function shuffle(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    async function createRoom() {
      saveNickname();
      const btn = document.getElementById('btnCreateRoom');
      btn.disabled = true; btn.textContent = '방 생성 중...';

      let total = parseInt(document.getElementById('totalCardsInput').value) || 30;
      prizesData = {};
      const prizeItems = document.querySelectorAll('.prize-item');
      for (let item of prizeItems) {
        const num = parseInt(item.querySelector('.p-num').value);
        const name = item.querySelector('.p-name').value.trim();
        const file = item.querySelector('.p-file').files[0];
        if (!isNaN(num) && name) prizesData[num] = { name: name, img: await compressAndReadFile(file) };
      }

      const code = Math.random().toString(36).substring(2, 8).toUpperCase();
      const numbers = shuffle(Array.from({length: total}, (_, i) => i + 1));
      const initialCards = numbers.map(num => ({ 
        value: num, picked: false, pickedBy: "", img: charImages[Math.floor(Math.random() * charImages.length)] 
      }));
      
      playersList = [myName];

      db.ref('rooms/' + code).set({ 
        cards: initialCards, prizes: prizesData, host: myName, players: playersList, createdAt: Date.now() 
      }).then(() => enterRoom(code));
    }

    function joinRoom() {
      saveNickname();
      const code = document.getElementById('roomInput').value.trim().toUpperCase();
      if (!code) return alert('방 코드를 입력해주세요.');

      db.ref('rooms/' + code).once('value', (snapshot) => { 
        if (snapshot.exists()) {
          const data = snapshot.val();
          let currentPlayers = data.players || [];
          if (!currentPlayers.includes(myName)) currentPlayers.push(myName);
          db.ref('rooms/' + code + '/players').set(currentPlayers);
          enterRoom(code);
        } else alert('방이 존재하지 않습니다.'); 
      });
    }

    function enterRoom(code) {
      currentRoom = code;
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('currentRoomCode').textContent = code;
      
      db.ref('rooms/' + code).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        prizesData = data.prizes || {};
        currentCardsData = data.cards || [];
        playersList = data.players || [];
        hostName = data.host || "방장";
        
        if (isHost()) document.getElementById('hostControls').classList.remove('hidden');

        renderPlayersOrder();
        renderPrizeBoard();
        renderGrid(currentCardsData);
      });
    }

    function isHost() { return hostName && hostName.trim() === myName.trim(); }

    function getCurrentTurnPlayer() {
      if (!playersList || playersList.length === 0) return "미지정";
      const pickedCount = currentCardsData.filter(c => c.picked).length;
      return playersList[pickedCount % playersList.length];
    }

    function isAllOpened() {
      return currentCardsData.length > 0 && currentCardsData.every(c => c.picked);
    }

    function renderPlayersOrder() {
      document.getElementById('hostName').textContent = hostName;
      const currentTurn = isAllOpened() ? "게임 종료" : getCurrentTurnPlayer();
      document.getElementById('currentTurnInfo').textContent = currentTurn;

      const tagsContainer = document.getElementById('playerTagsList');
      tagsContainer.innerHTML = '';
      
      const hostFlag = isHost();

      playersList.forEach((p, idx) => {
        const tag = document.createElement('div');
        tag.className = 'player-tag' + (p === currentTurn ? ' active' : '');
        
        let html = `<span>${idx + 1}. ${p}</span>`;
        if (hostFlag) {
          html += `
            <div class="player-btns-group">
              <button class="player-btn" onclick="movePlayer(${idx}, -1)">◀</button>
              <button class="player-btn" onclick="movePlayer(${idx}, 1)">▶</button>
              <button class="player-btn" onclick="editPlayerName(${idx})">✏️</button>
            </div>
          `;
        }
        tag.innerHTML = html;
        tagsContainer.appendChild(tag);
      });
    }

    function movePlayer(index, direction) {
      let targetIdx = index + direction;
      if (targetIdx < 0 || targetIdx >= playersList.length) return;
      let temp = playersList[index];
      playersList[index] = playersList[targetIdx];
      playersList[targetIdx] = temp;
      db.ref('rooms/' + currentRoom + '/players').set(playersList);
    }

    function editPlayerName(index) {
      let current = playersList[index];
      let newName = prompt('변경할 참가자 닉네임을 입력하세요:', current);
      if (newName && newName.trim() !== '') {
        playersList[index] = newName.trim();
        db.ref('rooms/' + currentRoom + '/players').set(playersList);
      }
    }

    function renderPrizeBoard() {
      const board = document.getElementById('prizeBoardList');
      board.innerHTML = '';

      Object.keys(prizesData).forEach(num => {
        const prize = prizesData[num];
        const winnerCard = currentCardsData.find(c => c.value == num && c.picked);
        const winnerName = winnerCard ? winnerCard.pickedBy : null;

        const item = document.createElement('div');
        item.className = 'prize-card';
        item.innerHTML = `
          <img src="${prize.img}" onerror="this.src='https://via.placeholder.com/150?text=Prize'">
          <div class="prize-info">
            <div class="num">[${num}번] ${prize.name}</div>
            <div class="winner">${winnerName ? '🎉 당첨자: ' + winnerName : '⏳ 미당첨'}</div>
          </div>
        `;
        board.appendChild(item);
      });
    }

    function renderGrid(cards) {
      const grid = document.getElementById('grid');
      let remainingCount = 0;

      cards.forEach((card, index) => {
        if (!card.picked) remainingCount++;
        let cardElem = document.getElementById(`kuji-card-${index}`);
        const prize = prizesData[card.value];
        const isWin = card.picked && !!prize;

        if (!cardElem) {
          cardElem = document.createElement('div');
          cardElem.id = `kuji-card-${index}`;
          cardElem.className = 'kuji-card';
          cardElem.onclick = () => openCardZoomModal(index);
          
          const contentDiv = document.createElement('div');
          contentDiv.className = 'card-content';
          contentDiv.innerHTML = `
            <div class="card-number" id="card-num-${index}"></div>
            <div class="card-picker" id="card-picker-${index}"></div>
          `;
          cardElem.appendChild(contentDiv);

          const coverElem = document.createElement('div');
          coverElem.className = 'card-cover';
          coverElem.id = `card-cover-${index}`;
          coverElem.style.backgroundImage = `url('${card.img || charImages[0]}')`;

          cardElem.appendChild(coverElem);
          grid.appendChild(cardElem);
        }

        const numElem = document.getElementById(`card-num-${index}`);
        const pickerElem = document.getElementById(`card-picker-${index}`);

        numElem.textContent = card.value;
        
        if (pickerElem) {
          if (card.pickedBy) {
            pickerElem.textContent = card.pickedBy;
            pickerElem.style.display = 'inline-block';
          } else {
            pickerElem.style.display = 'none';
          }
        }

        cardElem.className = 'kuji-card' + (card.picked ? ' picked' : '') + (isWin ? ' win' : '');
      });

      document.getElementById('status').textContent = `남은 카드: ${remainingCount}장`;
    }

    function openCardZoomModal(index) {
      const card = currentCardsData[index];
      if (!card || card.picked) return;
      
      selectedIndex = index;
      const modal = document.getElementById('cardZoomModal');
      const zoomNum = document.getElementById('zoomCardNum');
      const zoomUser = document.getElementById('zoomCardUser');
      const zoomCover = document.getElementById('zoomCardCover');

      zoomNum.textContent = card.value;
      zoomUser.textContent = getCurrentTurnPlayer();
      zoomCover.style.backgroundImage = `url('${card.img || charImages[0]}')`;
      zoomCover.style.transform = 'translateX(0) rotate(0deg)';

      modal.classList.remove('hidden');
    }

    function closeZoomModal() {
      document.getElementById('cardZoomModal').classList.add('hidden');
      selectedIndex = null;
    }

    // 뜯는 방향으로 날려버리는 로직 포함된 드래그 제어
    function setupZoomDrag() {
      const coverElem = document.getElementById('zoomCardCover');
      let startX = 0, currentDiff = 0, isDragging = false;

      const onStart = (x) => {
        if (selectedIndex === null) return;
        startX = x;
        currentDiff = 0;
        isDragging = true;
        coverElem.style.transition = 'none';
      };

      const onMove = (x) => {
        if (!isDragging) return;
        currentDiff = x - startX;
        coverElem.style.transform = `translateX(${currentDiff}px) rotate(${currentDiff * 0.1}deg)`;

        if (Math.abs(currentDiff) > 140) {
          isDragging = false;
          forceRipOpen(currentDiff > 0 ? 'right' : 'left');
        }
      };

      const onEnd = () => {
        if (isDragging) {
          coverElem.style.transition = 'transform 0.25s ease';
          coverElem.style.transform = 'translateX(0) rotate(0deg)';
          isDragging = false;
        }
      };

      coverElem.addEventListener('touchstart', (e) => onStart(e.touches[0].clientX));
      coverElem.addEventListener('touchmove', (e) => onMove(e.touches[0].clientX));
      coverElem.addEventListener('touchend', onEnd);
      coverElem.addEventListener('mousedown', (e) => onStart(e.clientX));
      window.addEventListener('mousemove', (e) => onMove(e.clientX));
      window.addEventListener('mouseup', onEnd);
    }

    // 슬라이드한 방향(좌/우)으로 겉 카드가 사뿐히 날아가는 애니메이션
    function forceRipOpen(direction = 'right') {
      if (selectedIndex === null) return;
      const coverElem = document.getElementById('zoomCardCover');
      coverElem.style.transition = 'transform 0.3s ease-out';
      
      const targetX = direction === 'right' ? '200%' : '-200%';
      const targetRotate = direction === 'right' ? '45deg' : '-45deg';
      coverElem.style.transform = `translateX(${targetX}) rotate(${targetRotate})`;
      
      setTimeout(() => {
        const chosenIndex = selectedIndex;
        closeZoomModal();
        pickCard(chosenIndex);
      }, 220);
    }

    function reselectRandomCard() {
      let unpickedIndices = [];
      currentCardsData.forEach((c, idx) => { if(!c.picked) unpickedIndices.push(idx); });
      if (unpickedIndices.length === 0) return alert('남은 카드가 없습니다.');
      
      const newIndex = unpickedIndices[Math.floor(Math.random() * unpickedIndices.length)];
      openCardZoomModal(newIndex);
    }

    // 번호가 중앙에 크고 뚜렷하게 강조된 후 제자리로 오는 연출 함수
    function showNumberRevealAnimation(val, player, isWin) {
      const overlay = document.getElementById('numRevealOverlay');
      const numText = document.getElementById('revealNumText');
      const subText = document.getElementById('revealSubText');

      numText.textContent = val + "번";
      subText.textContent = isWin ? `🎉 [당첨!] ${player}` : `👤 ${player}`;
      overlay.classList.add('show');

      setTimeout(() => {
        overlay.classList.remove('show');
      }, 1200);
    }

    function pickCard(index) { 
      if (!isHost()) return alert('방장만 카드를 뽑을 수 있습니다.');
      const card = currentCardsData[index];
      if (!card || card.picked) return;

      const turnPlayer = getCurrentTurnPlayer();
      const isWin = !!prizesData[card.value];

      // 1. 번호 크고 뚜렷하게 확인되는 팝업 연출 실행
      showNumberRevealAnimation(card.value, turnPlayer, isWin);

      // 2. 당첨 여부 시 효과음 및 꽃가루 연출
      if (isWin) {
        playWinSound();
        confetti({ particleCount: 150, spread: 100, origin: { y: 0.6 } });
      }

      // 3. 서버에 결과 전송
      db.ref('rooms/' + currentRoom).update({
        [`cards/${index}/picked`]: true,
        [`cards/${index}/pickedBy`]: turnPlayer
      });
    }

    function shuffleAndOpenRandom() {
      if (!isHost()) return alert('방장만 셔플할 수 있습니다.');
      let count = parseInt(document.getElementById('shuffleCountInput').value) || 5;

      let shuffledCards = [...currentCardsData];
      let unpickedIndices = [];
      shuffledCards.forEach((c, idx) => { if(!c.picked) unpickedIndices.push(idx); });

      if (unpickedIndices.length === 0) return alert('남아있는 카드가 없습니다.');

      unpickedIndices.forEach(idx => {
        const elem = document.getElementById(`kuji-card-${idx}`);
        if(elem) elem.classList.add('shaking');
      });

      setTimeout(() => {
        unpickedIndices.forEach(idx => {
          const elem = document.getElementById(`kuji-card-${idx}`);
          if(elem) elem.classList.remove('shaking');
        });

        for (let k = 0; k < count; k++) {
          let unpickedValues = unpickedIndices.map(i => shuffledCards[i]);
          unpickedValues = shuffle(unpickedValues);
          unpickedIndices.forEach((origIdx, i) => {
            shuffledCards[origIdx] = unpickedValues[i];
          });
        }

        db.ref('rooms/' + currentRoom + '/cards').set(shuffledCards).then(() => {
          const randomTarget = unpickedIndices[Math.floor(Math.random() * unpickedIndices.length)];
          openCardZoomModal(randomTarget);
        });
      }, 800);
    }
    
    function copyShareLink() { 
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl).then(() => alert('초대 링크가 복사되었습니다!')); 
    }
  </script>
</body>
