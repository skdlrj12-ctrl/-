<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍢 MY KUJI (규어빵 전용판)</title>
  <!-- 폭죽 이펙트 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    
    /* 배경 고화질 처리 */
    body { 
      background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('https://i.ibb.co/d0qnQSCq/image.jpg'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      color: #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      min-height: 100vh; 
      padding: 15px; 
    }
    
    h1 { margin-top: 5px; font-size: 1.8rem; text-align: center; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    p.sub { color: #ddd; font-size: 0.9rem; margin-bottom: 15px; text-shadow: 0 1px 3px rgba(0,0,0,0.8); }
    
    /* 전체 판 스타일 */
    .card-box { 
      background-color: rgba(20, 20, 20, 0.8); 
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px; 
      padding: 20px; 
      width: 98%; 
      max-width: 1000px; 
      text-align: center; 
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6); 
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .setting-group { 
      text-align: left; 
      background: rgba(42, 42, 42, 0.8); 
      padding: 18px; 
      border-radius: 12px; 
      max-width: 600px; 
      margin: 0 auto 15px auto; 
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .setting-group label { font-size: 0.95rem; color: #ccc; display: block; margin-bottom: 6px; font-weight: bold; }
    input[type="number"], input[type="text"] { width: 100%; padding: 10px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #444; background: rgba(26, 26, 26, 0.8); color: #fff; font-size: 1rem; }
    
    .prize-item { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
    .prize-item input { margin-bottom: 0; }

    button { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; background: #ffffff; color: #000; cursor: pointer; transition: all 0.2s; }
    button:active { opacity: 0.8; }
    button.btn-share { background: #4dabf7; color: #fff; width: auto; padding: 8px 16px; font-size: 0.85rem; }
    
    /* 상단 당첨 상품 보드 (가로 정렬) */
    .prize-board-top { 
      background: rgba(35, 35, 35, 0.85); 
      padding: 12px; 
      border-radius: 12px; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: left;
    }
    .prize-board-top h3 { font-size: 1rem; color: #ffeb3b; margin-bottom: 8px; border-bottom: 1px solid #444; padding-bottom: 4px; }
    .prize-list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
    .prize-card { display: flex; align-items: center; gap: 8px; background: rgba(20, 20, 20, 0.8); padding: 6px 8px; border-radius: 6px; border: 1px solid #444; }
    .prize-card img { width: 35px; height: 35px; border-radius: 4px; object-fit: cover; }
    .prize-info { font-size: 0.8rem; }
    .prize-info .num { color: #f39c12; font-weight: bold; }

    /* 크게 강조된 현재 차례 영역 */
    .turn-banner { 
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2), rgba(59, 130, 246, 0.2)); 
      border: 2px solid #22c55e; 
      border-radius: 12px; 
      padding: 12px; 
      text-align: center;
    }
    .turn-banner .title { font-size: 0.9rem; color: #aaa; margin-bottom: 2px; }
    .turn-banner .name { font-size: 1.8rem; font-weight: 900; color: #22c55e; text-shadow: 0 0 10px rgba(34, 197, 94, 0.5); }

    .control-btns { display: flex; gap: 10px; justify-content: center; }
    .btn-sub { font-size: 0.9rem; padding: 10px 16px; border-radius: 8px; width: auto; }
    .btn-slow { background: rgba(51, 51, 51, 0.8); color: #aaa; border: 1px solid #555; }
    .btn-slow.active { background: #f39c12; color: #fff; border-color: #f39c12; font-weight: bold; }
    .btn-random { background: #8e44ad; color: #fff; }

    /* 가로로 길쭉한 카드 배치 (5열 고정) */
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
    
    .kuji-card { 
      position: relative; 
      aspect-ratio: 1.3 / 1; /* 가로가 길쭉한 비율 */
      border-radius: 8px; 
      overflow: hidden !important; 
      background: rgba(34, 34, 34, 0.85); 
      touch-action: none; 
      cursor: pointer; 
      border: 1px solid rgba(255, 255, 255, 0.2); 
      isolation: isolate; 
    }
    .card-content { 
      position: absolute; 
      inset: 0; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 1; 
      pointer-events: none; 
      padding: 2px; 
      width: 100%;
    }
    .card-number { font-size: 1.4rem; font-weight: 900; color: #ffeb3b; letter-spacing: -0.5px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
    
    .card-picker { 
      font-size: 0.7rem; 
      color: #4dabf7; 
      font-weight: bold; 
      margin-top: 2px; 
      background: rgba(0,0,0,0.8); 
      padding: 1px 5px; 
      border-radius: 6px; 
      max-width: 90%; 
      overflow: hidden; 
      text-overflow: ellipsis; 
      white-space: nowrap; 
      text-align: center;
    }

    .card-cover { 
      position: absolute; 
      inset: 0; 
      background-size: cover; 
      background-repeat: no-repeat;
      background-position: center center; 
      background-color: #1a1a1a; 
      z-index: 10; 
      transition: transform 0.12s cubic-bezier(0.25, 1, 0.5, 1); 
      cursor: grab; 
      box-shadow: 0 2px 8px rgba(0,0,0,0.6); 
      transform-origin: left center;
      touch-action: none;
      will-change: transform;
    }
    .kuji-card.picked .card-cover { display: none !important; }
    .kuji-card.picked { border: 1px solid #555; background: rgba(24, 24, 24, 0.85); }
    .kuji-card.win { background: rgba(231, 76, 60, 0.9) !important; border-color: #ff6b6b; }
    .kuji-card.win .card-number { color: #fff !important; font-size: 1.2rem; }
    .win-name { font-size: 0.7rem; color: #fff; font-weight: bold; }

    /* 제일 하단 방 코드 정보 영역 */
    .room-info-bottom { 
      background: rgba(20, 20, 20, 0.6); 
      padding: 10px 14px; 
      border-radius: 8px; 
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 0.85rem;
      color: #aaa;
    }
    .room-code { color: #4dabf7; font-size: 1.1rem; font-weight: bold; letter-spacing: 1px; }

    .hidden { display: none; }

    @media (max-width: 768px) {
      .grid { grid-template-columns: repeat(5, 1fr); gap: 4px; }
      .card-number { font-size: 1rem; }
      .turn-banner .name { font-size: 1.4rem; }
      .prize-list-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>🍢 MY KUJI (규어빵 전용판)</h1>
  <p class="sub">실시간 제비뽑기 게임</p>

  <!-- 로비 화면 -->
  <div id="lobby" class="card-box">
    <div class="setting-group">
      <label>1. 참가자 이름 목록 (쉼표 구분 순서대로)</label>
      <input type="text" id="userNameInput" placeholder="예: 울산, 지수, 철수, 민수" value="울산">
      
      <label>2. 카드 총 수량 (최대 50장)</label>
      <input type="number" id="totalCardsInput" value="30" min="5" max="50">
      
      <label>3. 당첨 번호 및 상품 설정</label>
      <div id="prizeInputs">
        <div class="prize-item">
          <input type="number" placeholder="번호" class="p-num" style="width: 70px;">
          <input type="text" placeholder="상품 이름" class="p-name">
          <input type="text" placeholder="이미지 URL (선택)" class="p-img">
        </div>
      </div>
      <button onclick="addPrizeInput()" style="background: rgba(255,255,255,0.2); color: #fff; font-size: 0.85rem; padding: 6px;">+ 당첨 상품 추가</button>
    </div>

    <div style="max-width: 400px; margin: 0 auto; width: 100%;">
      <button onclick="createRoom()" style="background: #22c55e; color: #fff; margin-bottom: 8px;">방 만들기</button>
      <div style="color: #ddd; margin: 8px 0; font-size: 0.85rem;">— 또는 —</div>
      <input type="text" id="roomInput" placeholder="방 코드 6자리 입력" maxlength="6" style="text-transform: uppercase;">
      <button onclick="joinRoom()" style="background: #3b82f6; color: #fff;">방 참가하기</button>
    </div>
  </div>

  <!-- 게임 실행 화면 -->
  <div id="game" class="card-box hidden">
    <!-- 1. 상단 당첨 상품 목록 -->
    <div class="prize-board-top">
      <h3>🎁 당첨 상품 목록</h3>
      <div id="prizeBoardList" class="prize-list-grid"></div>
    </div>

    <!-- 2. 크게 강조된 현재 차례 표시 -->
    <div class="turn-banner">
      <div class="title">🎯 현재 차례 (카드 뽑을 사람)</div>
      <div id="currentTurnInfo" class="name">-</div>
    </div>

    <!-- 제어 버튼 및 잔여 카운트 -->
    <div class="control-btns">
      <button id="slowBtn" onclick="toggleSlowMode()" class="btn-sub btn-slow active">🍦 슬라이드 뜯기: ON</button>
      <button onclick="pickRandomCard()" class="btn-sub btn-random">🎲 랜덤 뽑기</button>
    </div>
    <div id="status" style="font-size: 0.9rem; color: #ccc;">남은 카드: -장</div>

    <!-- 3. 가로형 카드판 (5열 배치) -->
    <div class="grid" id="grid"></div>

    <!-- 4. 제일 하단 방 코드 & 초대 링크 영역 -->
    <div class="room-info-bottom">
      <div>방 코드: <span id="currentRoomCode" class="room-code"></span> | 진행자: <span id="hostName" style="color:#fff;">-</span></div>
      <button onclick="copyShareLink()" class="btn-share">📋 초대 링크 복사</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCK9pczUoVYyMcckD136aW",
      authDomain: "my-kuji-4d235.firebaseapp.com",
      databaseURL: "https://my-kuji-4d235-default-rtdb.firebaseio.com",
      projectId: "my-kuji-4d235",
      storageBucket: "my-kuji-4d235.firebasestorage.app",
      messagingSenderId: "47327791417",
      appId: "1:47327791417:web:e22ef4062"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentRoom = null;
    let prizesData = {};
    let isSlowMode = true;
    let currentCardsData = [];
    let myName = "익명";
    let playersList = [];
    let hostName = "";
    let activeDragIndex = -1;

    // 주술회전 고죠 사토루 영역전개 당첨 사운드
    const winAudio = new Audio('https://raw.githubusercontent.com/skdlrj12-ctrl/-/main/gojo_ryoiki.mp3');

    function playRipSound() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const bufferSize = ctx.sampleRate * 0.15;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1000;
        noise.connect(filter);
        filter.connect(ctx.destination);
        noise.start();
      } catch (e) {}
    }

    const charImages = [
      'https://i.ibb.co/nMGG93YS/miku.jpg',
      'https://i.ibb.co/vx66H5YR/marin.jpg',
      'https://i.ibb.co/QjP9RC5F/toga.jpg'
    ];

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const roomParam = urlParams.get('room');
      if (roomParam) {
        document.getElementById('roomInput').value = roomParam.toUpperCase();
      }
      addPrizeInput();
      addPrizeInput();
    });

    function addPrizeInput() {
      const container = document.getElementById('prizeInputs');
      const div = document.createElement('div');
      div.className = 'prize-item';
      div.innerHTML = `
        <input type="number" placeholder="번호" class="p-num" style="width: 70px;">
        <input type="text" placeholder="상품 이름" class="p-name">
        <input type="text" placeholder="이미지 URL (선택)" class="p-img">
      `;
      container.appendChild(div);
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateRoomCode() { return Math.random().toString(36).substring(2, 8).toUpperCase(); }

    function toggleSlowMode() {
      isSlowMode = !isSlowMode;
      const btn = document.getElementById('slowBtn');
      btn.textContent = isSlowMode ? "🍦 슬라이드 뜯기: ON" : "🍦 터치 뜯기: Direct";
      isSlowMode ? btn.classList.add('active') : btn.classList.remove('active');
    }

    function createRoom() {
      const rawNames = document.getElementById('userNameInput').value.trim();
      playersList = rawNames ? rawNames.split(',').map(s => s.trim()).filter(s => s) : ["익명"];
      myName = playersList[0];

      let total = parseInt(document.getElementById('totalCardsInput').value) || 30;
      
      prizesData = {};
      const prizeItems = document.querySelectorAll('.prize-item');
      prizeItems.forEach(item => {
        const num = parseInt(item.querySelector('.p-num').value);
        const name = item.querySelector('.p-name').value.trim();
        const img = item.querySelector('.p-img').value.trim();
        if (!isNaN(num) && name) {
          prizesData[num] = { name: name, img: img || 'https://via.placeholder.com/150?text=Prize' };
        }
      });

      const code = generateRoomCode();
      const numbers = shuffle(Array.from({length: total}, (_, i) => i + 1));
      const initialCards = numbers.map(num => ({ 
        value: num, 
        picked: false, 
        pickedBy: "", 
        slideX: 0,
        img: charImages[Math.floor(Math.random() * charImages.length)] 
      }));
      
      db.ref('rooms/' + code).set({ 
        cards: initialCards, 
        prizes: prizesData, 
        host: myName,
        players: playersList,
        createdAt: Date.now() 
      }).then(() => enterRoom(code));
    }

    function joinRoom() {
      const rawNames = document.getElementById('userNameInput').value.trim();
      const enteredList = rawNames ? rawNames.split(',').map(s => s.trim()).filter(s => s) : [];
      myName = enteredList[0] || "참가자_" + Math.floor(Math.random() * 100);

      const code = document.getElementById('roomInput').value.trim().toUpperCase();
      if (!code) return alert('방 코드를 입력해주세요.');

      db.ref('rooms/' + code).once('value', (snapshot) => { 
        if (snapshot.exists()) {
          const roomData = snapshot.val();
          let players = roomData.players || [];
          enteredList.forEach(p => { if (!players.includes(p)) players.push(p); });
          db.ref('rooms/' + code + '/players').set(players);
          enterRoom(code);
        } else { 
          alert('방이 존재하지 않습니다.'); 
        } 
      });
    }

    function enterRoom(code) {
      currentRoom = code;
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('currentRoomCode').textContent = code;
      
      db.ref('rooms/' + code).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        prizesData = data.prizes || {};
        currentCardsData = data.cards || [];
        playersList = data.players || [];
        hostName = data.host || (playersList.length > 0 ? playersList[0] : "");
        
        renderPlayersOrder();
        renderPrizeBoard();
        renderGrid(currentCardsData);
      });
    }

    function isHost() { return hostName && hostName.trim() === myName.trim(); }

    function getCurrentTurnPlayer() {
      if (!playersList || playersList.length === 0) return myName;
      const pickedCount = currentCardsData.filter(c => c.picked).length;
      return playersList[pickedCount % playersList.length];
    }

    function renderPlayersOrder() {
      document.getElementById('hostName').textContent = hostName || "미지정";
      document.getElementById('currentTurnInfo').textContent = getCurrentTurnPlayer();
    }

    function renderPrizeBoard() {
      const board = document.getElementById('prizeBoardList');
      board.innerHTML = '';
      Object.keys(prizesData).forEach(num => {
        const prize = prizesData[num];
        const item = document.createElement('div');
        item.className = 'prize-card';
        item.innerHTML = `
          <img src="${prize.img}" onerror="this.src='https://via.placeholder.com/150?text=Prize'">
          <div class="prize-info">
            <div class="num">[${num}번]</div>
            <div>${prize.name}</div>
          </div>
        `;
        board.appendChild(item);
      });
    }

    function renderGrid(cards) {
      const grid = document.getElementById('grid');
      let remainingCount = 0;

      cards.forEach((card, index) => {
        if (!card.picked) remainingCount++;
        let cardElem = document.getElementById(`kuji-card-${index}`);
        const prize = prizesData[card.value];
        const isWin = card.picked && !!prize;

        if (!cardElem) {
          cardElem = document.createElement('div');
          cardElem.id = `kuji-card-${index}`;
          cardElem.className = 'kuji-card';
          
          const contentDiv = document.createElement('div');
          contentDiv.className = 'card-content';
          contentDiv.innerHTML = `
            <div class="card-number" id="card-num-${index}"></div>
            <div id="win-name-${index}" class="win-name"></div>
            <div class="card-picker" id="card-picker-${index}"></div>
          `;
          cardElem.appendChild(contentDiv);

          const coverElem = document.createElement('div');
          coverElem.className = 'card-cover';
          coverElem.id = `card-cover-${index}`;
          coverElem.style.backgroundImage = `url('${card.img || charImages[0]}')`;
          cardElem.appendChild(coverElem);

          attachDragEvent(cardElem, coverElem, index);
          grid.appendChild(cardElem);
        }

        const numElem = document.getElementById(`card-num-${index}`);
        const winNameElem = document.getElementById(`win-name-${index}`);
        const pickerElem = document.getElementById(`card-picker-${index}`);
        const coverElem = document.getElementById(`card-cover-${index}`);

        if (numElem) numElem.textContent = isWin ? '🔥' + card.value : card.value;
        if (winNameElem) winNameElem.textContent = isWin ? prize.name : '';
        
        if (pickerElem) {
          if (card.pickedBy) {
            pickerElem.textContent = `👤 ${card.pickedBy}`;
            pickerElem.style.display = 'block';
          } else {
            pickerElem.style.display = 'none';
          }
        }

        cardElem.className = 'kuji-card' + (card.picked ? ' picked' : '') + (isWin ? ' win' : '');

        if (!card.picked && activeDragIndex !== index && coverElem) {
          const x = card.slideX || 0;
          const rot = (x / 10).toFixed(1);
          coverElem.style.transform = `translateX(${x}px) rotate(${rot}deg)`;
        }
      });

      document.getElementById('status').textContent = `남은 카드: ${remainingCount}장`;
    }

    function attachDragEvent(cardElem, coverElem, index) {
      let startX = 0, currentX = 0, isDragging = false;
      let syncTimer = null;

      function updateSlideX(x) {
        const rot = (x / 10).toFixed(1);
        coverElem.style.transform = `translateX(${x}px) rotate(${rot}deg)`;

        if (!syncTimer) {
          syncTimer = setTimeout(() => {
            if (currentRoom && isDragging) {
              db.ref(`rooms/${currentRoom}/cards/${index}/slideX`).set(x);
            }
            syncTimer = null;
          }, 60);
        }
      }

      function onStart(e) {
        if (!isHost()) {
          alert(`방 만든 사람(${hostName})만 카드를 뜯을 수 있습니다!`);
          return;
        }

        if (!isSlowMode) return pickCard(index);

        e.stopPropagation();

        isDragging = true;
        activeDragIndex = index;

        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        startX = pageX - currentX;
        coverElem.style.transition = 'none';

        const moveHandler = (ev) => onMove(ev);
        const endHandler = (ev) => onEnd(ev, moveHandler, endHandler);

        window.addEventListener('touchmove', moveHandler, { passive: false });
        window.addEventListener('touchend', endHandler);
        window.addEventListener('mousemove', moveHandler);
        window.addEventListener('mouseup', endHandler);
      }

      function onMove(e) {
        if (!isDragging) return;
        if (e.cancelable) e.preventDefault();

        const pageX = e.touches ? e.touches[0].pageX : e.pageX;
        currentX = (pageX - startX) * 0.6;
        updateSlideX(currentX);
      }

      function onEnd(e, moveFn, endFn) {
        if (!isDragging) return;
        isDragging = false;
        activeDragIndex = -1;

        window.removeEventListener('touchmove', moveFn);
        window.removeEventListener('touchend', endFn);
        window.removeEventListener('mousemove', moveFn);
        window.removeEventListener('mouseup', endFn);

        coverElem.style.transition = 'transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275)';

        if (Math.abs(currentX) > cardElem.clientWidth * 0.3) {
          const finalX = currentX > 0 ? 300 : -300;
          updateSlideX(finalX);
          setTimeout(() => pickCard(index), 180);
        } else { 
          updateSlideX(0);
        }
        currentX = 0;
      }

      coverElem.addEventListener('touchstart', onStart, { passive: false });
      coverElem.addEventListener('mousedown', onStart);
    }

    function triggerWinEffects() {
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });

      winAudio.currentTime = 0;
      winAudio.play().catch(() => {});
    }

    function pickCard(index) { 
      if (!isHost()) {
        alert(`방 만든 사람(${hostName})만 카드를 뜯을 수 있습니다!`);
        return;
      }

      const card = currentCardsData[index];
      if (!card || card.picked) return;

      playRipSound();

      const turnPlayer = getCurrentTurnPlayer();
      const isWin = !!prizesData[card.value];

      if (isWin) {
        triggerWinEffects();
      }

      if (currentRoom) {
        db.ref('rooms/' + currentRoom).update({
          [`cards/${index}/picked`]: true,
          [`cards/${index}/pickedBy`]: turnPlayer,
          [`cards/${index}/slideX`]: 0
        });
      } 
    }
    
    function pickRandomCard() { 
      if (!isHost()) {
        alert(`방 만든 사람(${hostName})만 카드를 뜯을 수 있습니다!`);
        return;
      }
      const unpicked = currentCardsData.map((c, i) => c.picked ? null : i).filter(i => i !== null); 
      if (unpicked.length > 0) pickCard(unpicked[Math.floor(Math.random() * unpicked.length)]); 
    }
    
    function copyShareLink() { 
      const inviteUrl = `${window.location.origin}${window.location.pathname}?room=${currentRoom}`;
      navigator.clipboard.writeText(inviteUrl).then(() => {
        alert('초대 링크가 복사되었습니다!');
      }); 
    }
  </script>
</body>
