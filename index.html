<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🎟️ MY KUJI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body { background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
    h1 { margin-top: 10px; font-size: 1.8rem; display: flex; align-items: center; gap: 8px; }
    p.sub { color: #888; font-size: 0.9rem; margin-bottom: 20px; }
    .card-box { background-color: #1e1e1e; border-radius: 16px; padding: 24px; width: 100%; max-width: 420px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
    
    .setting-group { text-align: left; background: #2a2a2a; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
    .setting-group label { font-size: 0.85rem; color: #aaa; display: block; margin-bottom: 6px; }
    
    input[type="number"], input[type="text"] { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #1a1a1a; color: #fff; text-align: center; font-size: 1rem; }
    
    button { width: 100%; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 8px; border: none; background: #ffffff; color: #000; cursor: pointer; margin-bottom: 8px; transition: all 0.2s; }
    button:active { opacity: 0.8; }
    button.btn-share { background: #4dabf7; color: #fff; margin-top: 5px; }

    .control-btns { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-sub { font-size: 0.85rem; padding: 10px; border-radius: 8px; }
    .btn-slow { background: #333; color: #aaa; border: 1px solid #555; }
    .btn-slow.active { background: #f39c12; color: #fff; border-color: #f39c12; font-weight: bold; }
    .btn-random { background: #8e44ad; color: #fff; }

    .room-info { background: #2a2a2a; padding: 14px; border-radius: 10px; margin-bottom: 15px; font-weight: bold; }
    .room-code { color: #4dabf7; font-size: 1.2rem; letter-spacing: 1px; }
    
    .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
    
    /* 카드 밀당 연출을 위한 커스텀 구조 */
    .kuji-card { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: #222; touch-action: none; cursor: pointer; }
    .card-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; color: #ffeb3b; z-index: 1; }
    .card-cover { position: absolute; inset: 0; background: #3b3b4f; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; font-weight: bold; z-index: 2; transition: transform 0.2s ease-out; }
    
    /* 이미 뽑힌 카드 */
    .kuji-card.picked .card-cover { display: none; }
    .kuji-card.picked { border: 1px solid #444; }
    .kuji-card.win { background: #e74c3c !important; }
    .kuji-card.win .card-number { color: #fff !important; font-size: 1.2rem; font-weight: 900; }
    
    .hidden { display: none; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <h1>🎟️ MY KUJI</h1>
  <p class="sub">실시간 제비뽑기 게임</p>

  <div id="lobby" class="card-box">
    <div class="setting-group">
      <label>1. 카드 총 수량 (최대 50장)</label>
      <input type="number" id="totalCardsInput" value="30" min="10" max="50">
      
      <label>2. 당첨 번호 (쉼표로 구분, 예: 7, 15, 23)</label>
      <input type="text" id="winningNumsInput" placeholder="당첨번호 입력 (선택사항)">
    </div>

    <button onclick="createRoom()" style="background: #22c55e; color: #fff;">방 만들기</button>
    <div style="color: #666; margin: 12px 0;">— 또는 —</div>
    <input type="text" id="roomInput" placeholder="방 코드 6자리 입력" maxlength="6" style="text-transform: uppercase;">
    <button onclick="joinRoom()">방 참가하기</button>
  </div>

  <div id="game" class="card-box hidden">
    <div class="room-info">
      <div>방 코드: <span id="currentRoomCode" class="room-code"></span></div>
      <button onclick="copyShareLink()" class="btn-share">📋 방 코드 & 링크 복사</button>
    </div>

    <div class="control-btns">
      <button id="slowBtn" onclick="toggleSlowMode()" class="btn-sub btn-slow active">🍦 슬라이드 뜯기: ON</button>
      <button onclick="pickRandomCard()" class="btn-sub btn-random">🎲 랜덤 뽑기</button>
    </div>

    <div id="status">남은 카드: -장</div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCK9pczUoVYyMcckD136aW",
      authDomain: "my-kuji-4d235.firebaseapp.com",
      databaseURL: "https://my-kuji-4d235-default-rtdb.firebaseio.com",
      projectId: "my-kuji-4d235",
      storageBucket: "my-kuji-4d235.firebasestorage.app",
      messagingSenderId: "47327791417",
      appId: "1:47327791417:web:e22ef4062"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let currentRoom = null;
    let winningNumbers = [];
    let isSlowMode = true; // 기본적으로 뜯기 모드 ON
    let currentCardsData = [];

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generateRoomCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    function toggleSlowMode() {
      isSlowMode = !isSlowMode;
      const btn = document.getElementById('slowBtn');
      if (isSlowMode) {
        btn.textContent = "🍦 슬라이드 뜯기: ON";
        btn.classList.add('active');
      } else {
        btn.textContent = "🍦 터치 뜯기: Direct";
        btn.classList.remove('active');
      }
    }

    function createRoom() {
      let total = parseInt(document.getElementById('totalCardsInput').value) || 30;
      if (total < 5) total = 5;
      if (total > 50) total = 50;

      const winInput = document.getElementById('winningNumsInput').value;
      const wins = winInput.split(',').map(n => parseInt(n.trim())).filter(n => !isNaN(n));

      const code = generateRoomCode();
      const numbers = Array.from({length: total}, (_, i) => i + 1);
      const shuffled = shuffle(numbers);
      const initialCards = shuffled.map(num => ({ value: num, picked: false }));

      db.ref('rooms/' + code).set({
        cards: initialCards,
        winningNumbers: wins,
        createdAt: Date.now()
      }).then(() => enterRoom(code));
    }

    function joinRoom() {
      const code = document.getElementById('roomInput').value.trim().toUpperCase();
      if (!code) return alert('방 코드를 입력하세요.');
      db.ref('rooms/' + code).once('value', (snapshot) => {
        if (snapshot.exists()) enterRoom(code);
        else alert('존재하지 않는 방 코드입니다.');
      });
    }

    function enterRoom(code) {
      currentRoom = code;
      document.getElementById('lobby').classList.add('hidden');
      document.getElementById('game').classList.remove('hidden');
      document.getElementById('currentRoomCode').textContent = code;

      db.ref('rooms/' + code).on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        winningNumbers = data.winningNumbers || [];
        currentCardsData = data.cards || [];
        renderGrid(currentCardsData);
      });
    }

    function renderGrid(cards) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      let remaining = 0;

      cards.forEach((card, index) => {
        if (!card.picked) remaining++;
        
        const cardElem = document.createElement('div');
        const isWin = card.picked && winningNumbers.includes(card.value);
        
        cardElem.className = 'kuji-card' + (card.picked ? ' picked' : '') + (isWin ? ' win' : '');
        
        const numElem = document.createElement('div');
        numElem.className = 'card-number';
        numElem.textContent = isWin ? `🔥${card.value}` : card.value;
        cardElem.appendChild(numElem);

        if (!card.picked) {
          const coverElem = document.createElement('div');
          coverElem.className = 'card-cover';
          coverElem.textContent = '?';
          cardElem.appendChild(coverElem);

          // 드래그 터키 아이스크림 연출 이벤트 등록
          attachDragEvent(cardElem, coverElem, index);
        }

        grid.appendChild(cardElem);
      });

      document.getElementById('status').textContent = `남은 카드: ${remaining} / ${cards.length}장`;
    }

    // 터키 아이스크림 스타일 슬라이드 뜯기 드래그 함수
    function attachDragEvent(cardElem, coverElem, index) {
      let startX = 0;
      let currentX = 0;
      let isDragging = false;

      function onStart(e) {
        if (!isSlowMode) {
          pickCard(index);
          return;
        }
        isDragging = true;
        startX = e.touches ? e.touches[0].clientX : e.clientX;
        coverElem.style.transition = 'none';
      }

      function onMove(e) {
        if (!isDragging) return;
        const x = e.touches ? e.touches[0].clientX : e.clientX;
        const diffX = x - startX;

        // 오른쪽으로 밀 때만 커버 이동 (최대 카드 폭까지)
        if (diffX > 0) {
          currentX = Math.min(diffX, cardElem.clientWidth);
          coverElem.style.transform = `translateX(${currentX}px)`;
        }
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        coverElem.style.transition = 'transform 0.25s ease-out';

        // 절반 이상 밀었으면 완전히 뜯김, 안 미달이면 다시 닫힘 (놀리기 연출)
        if (currentX > cardElem.clientWidth * 0.45) {
          coverElem.style.transform = `translateX(100%)`;
          setTimeout(() => pickCard(index), 200);
        } else {
          coverElem.style.transform = `translateX(0px)`;
        }
        currentX = 0;
      }

      // 모바일 터치 이벤트
      cardElem.addEventListener('touchstart', onStart);
      cardElem.addEventListener('touchmove', onMove);
      cardElem.addEventListener('touchend', onEnd);

      // PC 마우스 이벤트
      cardElem.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);
    }

    function pickCard(index) {
      if (!currentRoom) return;
      db.ref('rooms/' + currentRoom + '/cards/' + index + '/picked').set(true);
    }

    function pickRandomCard() {
      const unpicked = currentCardsData.map((c, i) => c.picked ? null : i).filter(i => i !== null);
      if (unpicked.length === 0) return alert('모든 카드가 이미 뽑혔습니다!');
      
      const randIdx = unpicked[Math.floor(Math.random() * unpicked.length)];
      pickCard(randIdx);
    }

    function copyShareLink() {
      const shareText = `🎟️ MY KUJI 쿠지 게임에 초대합니다!\n방 코드: ${currentRoom}\n접속 링크: https://skdlrj12-ctrl.github.io/-/`;
      navigator.clipboard.writeText(shareText).then(() => {
        alert('방 코드와 링크가 복사되었습니다!');
      });
    }
  </script>
</body>
</html>
