<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>이벤트 / 뽑기 게임</title>
  <style>
    /* 1. 배경 화면 설정 (선명하게 수정) */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Noto Sans KR', sans-serif;
      /* 원본 이미지 링크 적용 및 흐림 효과 제거 */
      background: url('https://i.ibb.co/d0qnQSCq/image.jpg') no-repeat center center fixed;
      background-size: cover;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* 메인 컨테이너 */
    .container {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      padding: 30px;
      width: 90%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
      text-align: center;
    }

    h1 {
      margin-bottom: 20px;
      color: #222;
    }

    /* 당첨 사운드 및 유튜브 설정 섹션 */
    .sound-setting-box {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      border-radius: 12px;
      padding: 15px;
      margin-top: 20px;
      text-align: left;
    }

    .sound-setting-box label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
      color: #495057;
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
    }

    .input-group input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 14px;
    }

    .btn {
      padding: 10px 16px;
      background-color: #ff4757;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn:hover {
      background-color: #e84118;
    }

    .btn-secondary {
      background-color: #57606f;
    }

    .btn-secondary:hover {
      background-color: #2f3542;
    }

    /* 유튜브 임베드 플레이어 영역 */
    .youtube-player-container {
      margin-top: 10px;
      position: relative;
      width: 100%;
      height: 0;
      padding-bottom: 56.25%; /* 16:9 비율 */
      display: none; /* 링크 입력 전에는 숨김 */
      border-radius: 8px;
      overflow: hidden;
    }

    .youtube-player-container iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎉 당첨 뽑기 게임 🎉</h1>
    
    <!-- 기존 게임 영역 위치 -->
    <div id="game-area">
      <p>게임 관련 콘텐츠가 들어가는 영역입니다.</p>
    </div>

    <!-- 당첨 사운드 및 유튜브 음악 재생 설정 칸 -->
    <div class="sound-setting-box">
      <label for="yt-link">🎵 당첨 사운드 / 유튜브 음악 설정</label>
      <div class="input-group">
        <input type="text" id="yt-link" placeholder="유튜브 링크를 입력하세요 (예: https://youtu.be/...)">
        <button class="btn" onclick="loadYouTubeVideo()">적용 / 재생</button>
      </div>

      <!-- 유튜브 플레이어 표시 공간 -->
      <div id="yt-player-box" class="youtube-player-container">
        <iframe id="yt-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    // 유튜브 URL에서 Video ID 추출 함수
    function extractYouTubeID(url) {
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 유튜브 영상 로드 및 재생 함수
    function loadYouTubeVideo() {
      const urlInput = document.getElementById('yt-link').value.trim();
      const videoId = extractYouTubeID(urlInput);
      const playerBox = document.getElementById('yt-player-box');
      const iframe = document.getElementById('yt-iframe');

      if (videoId) {
        // 자동 재생(autoplay=1) 및 루프 설정
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1`;
        playerBox.style.display = 'block';
      } else {
        alert('올바른 유튜브 링크를 입력해주세요.');
      }
    }

    // 당첨 발생 시 호출할 함수 예시
    function triggerWinSound() {
      const iframe = document.getElementById('yt-iframe');
      if (iframe.src) {
        // 당첨되었을 때 음악 재개/재생 처리
        loadYouTubeVideo();
      }
    }
  </script>
</body>
</html>
