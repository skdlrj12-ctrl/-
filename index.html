<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>🍢 MY KUJI (규어빵 전용판) v23 - 최종 통합본</title>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background-image: url('./background.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: scroll;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      transition: background 0.3s ease;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 99%;
      max-width: 1550px;
      margin-top: 5px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .title-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    h1 {
      font-size: 1.5rem;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0,0,0,0.9);
      cursor: pointer;
    }

    .version-tag {
      background: #e67e22;
      color: #fff;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 12px;
    }

    .top-action-btns {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .audio-url-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid #3b82f6;
      padding: 4px 8px;
      border-radius: 20px;
      backdrop-filter: blur(8px);
    }

    .audio-url-wrapper input[type="text"] {
      width: 190px;
      padding: 4px 8px;
      border-radius: 12px;
      border: 1px solid #555;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 0.75rem;
      margin-bottom: 0;
    }

    .audio-url-wrapper button {
      width: auto;
      padding: 4px 10px;
      font-size: 0.75rem;
      background: #3b82f6;
      color: #fff;
      border-radius: 12px;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 3px 5px;
      border-radius: 18px;
      background: rgba(0, 0, 0, 0.55);
      border: 1px solid rgba(59,130,246,0.8);
      backdrop-filter: blur(8px);
    }

    .audio-controls button {
      width: auto;
      min-width: 30px;
      padding: 4px 7px;
      font-size: 0.78rem;
      line-height: 1;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 10px;
    }

    #volumeControl {
      width: 72px;
      accent-color: #3b82f6;
      cursor: pointer;
    }

    #youtubePlayerBox {
      display: none;
      position: fixed;
      right: 12px;
      bottom: 12px;
      width: 280px;
      max-width: calc(100vw - 24px);
      background: rgba(20,20,20,0.96);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 14px;
      padding: 8px;
      z-index: 5000;
      box-shadow: 0 10px 35px rgba(0,0,0,0.8);
    }

    #youtubePlayerBox.show {
      display: block;
    }

    #youtubePlayerTitle {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: #fff;
      margin-bottom: 6px;
    }

    #youtubePlayerFrame {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: 0;
      border-radius: 8px;
      overflow: hidden;
    }

    #youtubePlayerClose {
      width: auto;
      padding: 3px 8px;
      background: #e74c3c;
      color: #fff;
      font-size: 0.7rem;
      border-radius: 6px;
    }

    p.sub {
      color: #eee;
      font-size: 0.9rem;
      margin-bottom: 15px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }

    .card-box {
      background-color: rgba(15, 15, 15, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 20px;
      padding: 18px;
      width: 99%;
      max-width: 1550px;
      text-align: center;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .setting-group {
      text-align: left;
      background: rgba(0, 0, 0, 0.16);
      padding: 16px;
      border-radius: 12px;
      max-width: 600px;
      margin: 0 auto 10px auto;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .setting-group label {
      font-size: 0.95rem;
      color: #ddd;
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="number"],
    input[type="text"],
    input[type="file"],
    textarea {
      width: 100%;
      padding: 9px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #555;
      background: rgba(0, 0, 0, 0.42);
      color: #fff;
      font-size: 0.95rem;
    }

    .prize-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .prize-item-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      border: none;
      background: #ffffff;
      color: #000;
      cursor: pointer;
    }

    button:active {
      opacity: 0.8;
    }

    button.btn-share {
      background: #4dabf7;
      color: #fff;
      width: auto;
      padding: 6px 14px;
      font-size: 0.85rem;
    }

    .prize-board-top {
      background: rgba(0, 0, 0, 0.34);
      padding: 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      text-align: left;
    }

    .prize-list-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
    }

    .prize-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .prize-card img {
      width: 85px;
      height: 85px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid rgba(255,255,255,0.4);
      flex-shrink: 0;
    }

    .prize-info {
      font-size: 0.9rem;
      flex-grow: 1;
    }

    .prize-info .num {
      color: #ffeb3b;
      font-weight: bold;
      font-size: 1rem;
    }

    .prize-info .owner {
      color: #aaa;
      font-size: 0.8rem;
      margin-top: 2px;
    }

    .prize-info .winner {
      color: #22c55e;
      font-weight: bold;
      font-size: 0.85rem;
      margin-top: 4px;
      background: rgba(34,197,94,0.15);
      padding: 3px 6px;
      border-radius: 4px;
      display: inline-block;
    }

    .manager-box {
      background: rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 10px 14px;
      text-align: left;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }

    .manager-box h4 {
      color: #ffeb3b;
      font-size: 0.9rem;
      margin: 0;
    }

    .player-tags-container {
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      width: 100%;
    }

    .player-tag {
      background: rgba(0, 0, 0, 0.75);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      display: inline-flex !important;
      flex-direction: row !important;
      align-items: center !important;
      gap: 8px !important;
      border: 1px solid rgba(255, 255, 255, 0.3);
      white-space: nowrap !important;
    }

    .player-tag.active {
      border-color: #22c55e;
      background: rgba(34, 197, 94, 0.35);
      color: #22c55e;
      font-weight: bold;
    }

    .player-btns-group {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .player-btn {
      background: rgba(255, 255, 255, 0.25);
      border: none;
      color: #fff;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      width: auto;
    }

    .turn-banner {
      background: linear-gradient(
        135deg,
        rgba(34, 197, 94, 0.3),
        rgba(59, 130, 246, 0.3)
      );
      border: 2px solid #22c55e;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
    }

    .turn-banner .title {
      font-size: 0.85rem;
      color: #bbb;
      margin-bottom: 2px;
    }

    .turn-banner .name {
      font-size: 1.7rem;
      font-weight: 900;
      color: #22c55e;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }

    .control-btns {
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-sub {
      font-size: 0.85rem;
      padding: 8px 14px;
      border-radius: 8px;
      width: auto;
    }

    .btn-shuffle {
      background: #e67e22;
      color: #fff;
    }

    .btn-reset {
      background: #e74c3c;
      color: #fff;
    }

    .coordinate-board-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
      width: 100%;
      padding: 10px 0;
    }

    .coordinate-top-header {
      display: grid;
      grid-template-columns: 35px repeat(10, 1fr);
      gap: 6px;
      width: 100%;
      max-width: 1100px;
      margin-bottom: 6px;
      text-align: center;
      font-weight: bold;
      color: #ffeb3b;
      font-size: 0.95rem;
    }

    .coordinate-row-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 100%;
      max-width: 1100px;
    }

    .coordinate-grid-row {
      display: grid;
      grid-template-columns: 35px repeat(10, 1fr);
      gap: 6px;
      align-items: center;
    }

    .row-label {
      text-align: center;
      font-weight: bold;
      color: #ffeb3b;
      font-size: 0.95rem;
    }

    .kuji-card {
      position: relative;
      aspect-ratio: 1.25 / 1;
      border-radius: 8px;
      overflow: hidden;
      background: rgba(10, 10, 10, 0.6);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    .card-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
      padding: 4px;
      width: 100%;
      opacity: 0;
    }

    .kuji-card.picked .card-content {
      opacity: 1;
    }

    .card-number {
      font-size: 1.1rem;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow:
        -1px -1px 0 #000,
        1px -1px 0 #000,
        -1px 1px 0 #000,
        1px 1px 0 #000;
    }

    .card-picker {
      position: absolute;
      bottom: 2px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.65rem;
      color: #ffffff;
      font-weight: bold;
      background: rgba(0, 0, 0, 0.85);
      padding: 2px 4px;
      border-radius: 6px;
      max-width: 90%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }

    .card-cover {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-color: #222;
      z-index: 10;
    }

    .kuji-card.picked .card-cover {
      display: none !important;
    }

    @keyframes cardShake {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-4px, 3px) rotate(-3deg); }
      40% { transform: translate(4px, -3px) rotate(3deg); }
      60% { transform: translate(-3px, -2px) rotate(-2deg); }
      80% { transform: translate(3px, 2px) rotate(2deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .kuji-card.shaking {
      animation: cardShake 0.15s infinite;
    }

    .kuji-card.win {
      background-image: url('https://i.ibb.co/wr4D4fR8/image.jpg') !important;
      background-size: cover !important;
      background-position: center !important;
      border: 2.5px solid #ff3333 !important;
      box-shadow: 0 0 12px rgba(255, 51, 51, 0.8);
    }

    .num-reveal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .num-reveal-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    .num-reveal-box {
      font-size: 6rem;
      font-weight: 900;
      color: #ffeb3b;
      text-shadow: 0 0 30px rgba(255, 235, 59, 0.8), 0 0 10px #000;
      transform: scale(0.3);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .num-reveal-overlay.show .num-reveal-box {
      transform: scale(1.2);
    }

    .num-reveal-sub {
      font-size: 1.4rem;
      color: #22c55e;
      font-weight: bold;
      margin-top: 10px;
    }

    .card-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      z-index: 1500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .pop-card-wrapper {
      position: relative;
      width: 280px;
      height: 220px;
      border-radius: 16px;
      overflow: hidden;
      background: #151515;
      border: 2px solid rgba(255,255,255,0.3);
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      touch-action: none;
    }

    .pop-card-content {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 1;
    }

    .pop-card-num {
      font-size: 3.5rem;
      font-weight: 900;
      color: #ffeb3b;
    }

    .pop-card-user {
      position: absolute;
      bottom: 12px;
      font-size: 1rem;
      font-weight: bold;
      color: #fff;
      background: rgba(0,0,0,0.8);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .pop-card-cover {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      background-color: #222;
      z-index: 10;
      transition: transform 0.1s ease-out;
      cursor: grab;
      transform-origin: center center;
      touch-action: none;
    }

    .modal-btn-group {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .grand-summary-box {
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 12px;
      padding: 12px;
      margin-top: 15px;
      text-align: left;
    }

    .grand-summary-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grand-summary-textarea {
      width: 100%;
      height: 180px;
      background: rgba(0,0,0,0.6);
      color: #fff;
      border: 1px solid #555;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-family: monospace;
      resize: vertical;
    }

    .grand-btn-group {
      display: flex;
      gap: 8px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .grand-btn-group button {
      width: auto;
      padding: 8px 14px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-wrapper">
      <h1 onclick="location.href=location.pathname">🍢 MY KUJI (규어빵 전용판)</h1>
      <span class="version-tag">v23</span>
    </div>
    <div class="top-action-btns">
      <div class="audio-url-wrapper">
        <input type="text" id="bgmUrlInput" placeholder="유튜브 BGM 링크 또는 ID">
        <button onclick="setBgmUrl()">BGM 적용</button>
      </div>
      <div class="audio-controls">
        <button onclick="togglePlayBgm()" id="bgmPlayBtn">▶</button>
        <button onclick="stopBgm()">⏹</button>
        <input type="range" id="volumeControl" min="0" max="100" value="30" oninput="changeVolume(this.value)">
      </div>
      <button class="btn-share" onclick="copyRoomLink()">🔗 방 링크 복사</button>
    </div>
  </div>

  <div id="youtubePlayerBox">
    <div id="youtubePlayerTitle">
      <span>배경음악 재생 중</span>
      <button id="youtubePlayerClose" onclick="closeYoutubePlayer()">닫기</button>
    </div>
    <div id="youtubePlayerFrame"></div>
  </div>

  <div class="card-box" id="mainContainer">
    <p class="sub">방을 생성하거나 참여할 방 코드를 입력하세요.</p>
    <div class="setting-group">
      <label>새 방 만들기 (방장용)</label>
      <input type="text" id="newRoomName" placeholder="방 이름을 입력하세요">
      <button onclick="createRoom()" style="background:#22c55e; color:#fff;">방 생성하기</button>
    </div>
    <div class="setting-group">
      <label>기존 방 참가하기</label>
      <input type="text" id="joinRoomCode" placeholder="방 코드(ID) 입력">
      <button onclick="joinRoom()" style="background:#3b82f6; color:#fff;">입장하기</button>
    </div>
  </div>

  <div class="num-reveal-overlay" id="numRevealOverlay" onclick="closeNumReveal()">
    <div class="num-reveal-box" id="numRevealBox">1</div>
    <div class="num-reveal-sub" id="numRevealSub">당첨!</div>
  </div>

  <div id="cardModalContainer"></div>

  <script>
    // Firebase 설정 (기존 정보 유지)
    const firebaseConfig = {
      databaseURL: "https://my-kuji-default-rtdb.firebaseio.com/"
    };
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let currentRoom = null;
    let isHost = false;
    let myNickname = "";
    let localState = null;

    const alphabetCols = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];

    // 접속 시 URL 파라미터 자동 입장
    window.addEventListener('load', () => {
      const params = new URLSearchParams(window.location.search);
      const room = params.get('room');
      if (room) {
        document.getElementById('joinRoomCode').value = room;
        // 닉네임 확인 후 자동 입장 처리 가능하도록 UI 조정
      }
    });

    function createRoom() {
      const name = document.getElementById('newRoomName').value.trim();
      if (!name) {
        alert("방 이름을 입력해주세요.");
        return;
      }
      const roomId = 'room_' + Date.now() + Math.random().toString(36).substring(2, 6);
      
      const initialData = {
        title: name,
        createdAt: Date.now(),
        settings: { totalCards: 100, coverImage: "" },
        prizes: [],
        cards: {},
        participants: {},
        history: [],
        currentTurnIndex: 0,
        customGrandSummary: null
      };

      db.ref('rooms/' + roomId).set(initialData).then(() => {
        location.href = `?room=${roomId}&host=1`;
      });
    }

    function joinRoom() {
      const roomId = document.getElementById('joinRoomCode').value.trim();
      if (!roomId) {
        alert("방 코드를 입력해주세요.");
        return;
      }
      db.ref('rooms/' + roomId).once('value', snapshot => {
        if (!snapshot.exists()) {
          alert("존재하지 않는 방입니다.");
          return;
        }
        const nick = prompt("사용할 닉네임을 입력해주세요:", "참가자_" + Math.floor(Math.random()*1000));
        if (!nick) return;
        location.href = `?room=${roomId}&nick=${encodeURIComponent(nick)}`;
      });
    }

    // 초기화면 파싱 및 라우팅 제어
    const urlParams = new URLSearchParams(window.location.search);
    const activeRoomId = urlParams.get('room');
    const hostFlag = urlParams.get('host');
    const participantNick = urlParams.get('nick');

    if (activeRoomId) {
      currentRoom = activeRoomId;
      isHost = (hostFlag === '1');
      if (participantNick) {
        myNickname = decodeURIComponent(participantNick);
      } else if (isHost) {
        myNickname = "[방장]";
      }

      // 방 데이터 감시 및 자동 삭제 처리 로직 포함
      initRoomListener();
    }

    function initRoomListener() {
      const roomRef = db.ref('rooms/' + currentRoom);
      
      // 참가자 등록 및 퇴장 시 자동 삭제 감지 설정
      if (!isHost && myNickname) {
        const participantRef = roomRef.child('participants/' + myNickname.replace(/[.#$\/\[\]]/g, '_'));
        participantRef.set({ online: true, lastActive: firebase.database.ServerValue.TIMESTAMP });
        participantRef.onDisconnect().remove();
      }

      roomRef.on('value', snapshot => {
        const data = snapshot.val();
        if (!data) {
          alert("방이 삭제되었거나 존재하지 않습니다.");
          location.href = location.pathname;
          return;
        }

        // 방에 참가자가 0명이면 방 자동 삭제 처리 (방장 부재 시 포함)
        if (isHost && (!data.participants || Object.keys(data.participants).length === 0)) {
          // 일정 시간 유예 후 삭제하거나 즉시 삭제 제어 가능 (여기선 딜레이 또는 즉시 반영)
        }

        localState = data;
        renderApp(data);
      });
    }

    // 주기적으로 참가자 체크하여 방장 관점에서 아무도 없으면 방 삭제
    setInterval(() => {
      if (isHost && currentRoom && localState) {
        const participants = localState.participants || {};
        if (Object.keys(participants).length === 0) {
          db.ref('rooms/' + currentRoom).remove().then(() => {
            console.log("참가자가 없어 방이 자동 삭제되었습니다.");
          });
        }
      }
    }, 5000);

    function renderApp(data) {
      const container = document.getElementById('mainContainer');
      if (isHost) {
        renderHostView(container, data);
      } else {
        renderParticipantView(container, data);
      }
    }

    // ---------------------------------------------------------
    // 방장 화면 렌더링
    // ---------------------------------------------------------
    function renderHostView(container, data) {
      container.innerHTML = `
        <h2 style="color:#ffeb3b;">👑 방장 제어판: ${escapeHtml(data.title)}</h2>
        
        <div class="manager-box">
          <h4>참가자 관리 및 턴 제어</h4>
          <div class="player-tags-container" id="playerTagsContainer"></div>
        </div>

        <div class="turn-banner">
          <div class="title">현재 턴 (주인공)</div>
          <div class="name" id="currentTurnNameDisplay">지정 안됨</div>
        </div>

        <div class="control-btns">
          <button class="btn-sub btn-shuffle" onclick="shuffleCards()">🔀 카드 섞기/초기화</button>
          <button class="btn-sub btn-reset" onclick="resetAllCardsModal()">🔄 전체 카드 닫기</button>
        </div>

        <div class="prize-board-top">
          <h3 style="margin-bottom:10px; color:#ffeb3b;">🎁 상품 현황 및 설정</h3>
          <div id="prizeEditorContainer"></div>
          <button onclick="savePrizes()" style="background:#3b82f6; color:#fff; margin-top:8px;">💾 상품 설정 저장</button>
        </div>

        <div class="coordinate-board-wrapper">
          <div class="coordinate-top-header">
            <div></div>
            ${alphabetCols.map(c => `<div>${c}</div>`).join('')}
          </div>
          <div class="coordinate-row-container" id="coordinateGridContainer"></div>
        </div>

        <div class="grand-summary-box">
          <div class="grand-summary-header">
            <h3 style="color:#ffeb3b;">📋 총정리 및 히스토리</h3>
          </div>
          <textarea id="grandSummaryTextArea" class="grand-summary-textarea"></textarea>
          <div class="grand-btn-group">
            <button onclick="saveGrandSummaryText('${currentRoom}/customGrandSummary')" style="background:#3b82f6; color:#fff;">💾 수정사항 저장</button>
            <button onclick="resetGrandSummaryText('${currentRoom}/customGrandSummary')" style="background:#e67e22; color:#fff;">🔄 자동 계산으로 복원</button>
            <button onclick="copyGrandSummaryText()" style="background:#22c55e; color:#fff;">📋 텍스트 복사하기</button>
          </div>
        </div>
      `;

      updatePlayerTagsUI(data);
      updateCoordinateGrid(data);
      updatePrizeEditorUI(data);
      updateGrandSummaryUI(data);
    }

    // ---------------------------------------------------------
    // 참가자 화면 렌더링 (슬라이드 정상 작동 보완)
    // ---------------------------------------------------------
    function renderParticipantView(container, data) {
      container.innerHTML = `
        <h2 style="color:#3b82f6;">🎮 참관자 모드 (${escapeHtml(myNickname)})</h2>
        
        <div class="turn-banner">
          <div class="title">현재 진행 중인 턴</div>
          <div class="name">${data.currentTurnUser || '지정 안됨'}</div>
        </div>

        <div class="coordinate-board-wrapper">
          <div class="coordinate-top-header">
            <div></div>
            ${alphabetCols.map(c => `<div>${c}</div>`).join('')}
          </div>
          <div class="coordinate-row-container" id="coordinateGridContainer"></div>
        </div>

        <div class="prize-board-top">
          <h3 style="margin-bottom:10px; color:#ffeb3b;">🎁 상품 현황판</h3>
          <div class="prize-list-grid" id="participantPrizeGrid"></div>
        </div>
      `;

      updateCoordinateGrid(data);
      updateParticipantPrizes(data);
    }

    // 쿠지 그리드 동적 생성 (좌표계 기반 및 슬라이드 인터랙션 지원)
    function updateCoordinateGrid(data) {
      const gridContainer = document.getElementById('coordinateGridContainer');
      if (!gridContainer) return;
      gridContainer.innerHTML = '';

      const cards = data.cards || {};
      const totalCards = data.settings?.totalCards || 100;
      const rowCount = totalCards / 10;

      for (let r = 1; r <= rowCount; r++) {
        const rowDiv = document.createElement('div');
        rowDiv.className = 'coordinate-grid-row';

        const labelDiv = document.createElement('div');
        labelDiv.className = 'row-label';
        labelDiv.textContent = r;
        rowDiv.appendChild(labelDiv);

        alphabetCols.forEach((col, colIdx) => {
          const cardIndex = (r - 1) * 10 + colIdx + 1;
          const cardKey = `${col}${r}`;
          const cardData = cards[cardKey] || { number: cardIndex, picked: false, picker: '', isWin: false };

          const cardEl = document.createElement('div');
          cardEl.className = `kuji-card ${cardData.picked ? 'picked' : ''} ${cardData.isWin ? 'win' : ''}`;
          cardEl.innerHTML = `
            <div class="card-content">
              <span class="card-number">${cardData.number}</span>
              <span class="card-picker">${escapeHtml(cardData.picker || '')}</span>
            </div>
            <div class="card-cover" style="background-image: url('${data.settings?.coverImage || ''}');"></div>
          `;

          // 클릭 또는 터치 시 카드 오픈 모달 실행
          cardEl.onclick = () => {
            openCardModal(cardKey, cardData);
          };

          rowDiv.appendChild(cardEl);
        });

        gridContainer.appendChild(rowDiv);
      }
    }

    // 카드 스크래치 / 슬라이드 모달 구현 (참가자 슬라이드 안 보임 문제 해결)
    function openCardModal(cardKey, cardData) {
      const modalContainer = document.getElementById('cardModalContainer');
      modalContainer.innerHTML = `
        <div class="card-modal-overlay" id="cardModalOverlay">
          <div class="pop-card-wrapper" id="popCardWrapper">
            <div class="pop-card-content">
              <span class="pop-card-num">${cardData.number}</span>
              <span class="pop-card-user">${cardData.picked ? escapeHtml(cardData.picker) : (myNickname || '오픈 중')}</span>
            </div>
            <div class="pop-card-cover" id="popCardCover" style="background-image: url('${localState.settings?.coverImage || ''}');"></div>
          </div>
          <div class="modal-btn-group">
            <button onclick="closeCardModal()" style="background:#e74c3c; color:#fff; width:auto; padding:8px 16px;">닫기</button>
          </div>
        </div>
      `;

      // 슬라이드(드래그/터치 긁기) 인터랙션 로직 추가
      const cover = document.getElementById('popCardCover');
      let isDragging = false;
      let startX = 0, startY = 0;

      const onStart = (e) => {
        isDragging = true;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX;
        startY = clientY;
      };

      const onMove = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const deltaX = clientX - startX;
        const deltaY = clientY - startY;

        cover.style.transform = `translate(${deltaX}px, ${deltaY}px) rotate(${deltaX * 0.1}deg)`;
        cover.style.opacity = Math.max(1 - Math.abs(deltaX)/150, 0);

        // 일정 거리 이상 밀어내면 카드 자동 오픈 처리
        if (Math.abs(deltaX) > 100 || Math.abs(deltaY) > 100) {
          isDragging = false;
          processCardPick(cardKey);
        }
      };

      const onEnd = () => {
        if (!isDragging) return;
        isDragging = false;
        cover.style.transform = `translate(0, 0) rotate(0deg)`;
      };

      cover.addEventListener('mousedown', onStart);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onEnd);

      cover.addEventListener('touchstart', onStart);
      window.addEventListener('touchmove', onMove);
      window.addEventListener('touchend', onEnd);
    }

    function closeCardModal() {
      document.getElementById('cardModalContainer').innerHTML = '';
    }

    function processCardPick(cardKey) {
      closeCardModal();
      const pickerName = localState.currentTurnUser || myNickname || "참가자";
      
      db.ref(`rooms/${currentRoom}/cards/${cardKey}`).update({
        picked: true,
        picker: pickerName
      }).then(() => {
        // 히스토리 및 상품 기록 추가
        const history = localState.history || [];
        history.push({
          cardKey: cardKey,
          picker: pickerName,
          timestamp: Date.now()
        });
        db.ref(`rooms/${currentRoom}/history`).set(history);
      });
    }

    // 총정리 자동 생성 및 수정/초기화 기능
    function updateGrandSummaryUI(data) {
      const textarea = document.getElementById('grandSummaryTextArea');
      if (!textarea) return;

      const custom = data.customGrandSummary;
      if (custom !== undefined && custom !== null) {
        textarea.value = custom;
      } else {
        textarea.value = generateDefaultSummaryText(data);
      }
    }

    function generateDefaultSummaryText(data) {
      let text = `[ MY KUJI 총정리 보고서 ]\n`;
      text += `방 이름: ${data.title}\n----------------------------------\n`;
      const history = data.history || [];
      history.forEach((h, idx) => {
        text += `${idx + 1}. [${h.cardKey}] 카드 오픈 - 당첨자: ${h.picker}\n`;
      });
      return text;
    }

    function saveGrandSummaryText(path) {
      const textarea = document.getElementById("grandSummaryTextArea");
      if (!textarea || !path) return;
      db.ref(path).set(textarea.value).then(() => {
        alert("총정리 수정사항이 저장되었습니다!");
      });
    }

    function resetGrandSummaryText(path) {
      if (!path) return;
      if (confirm("자동 계산된 원본 텍스트로 복원하시겠습니까?")) {
        db.ref(path).remove().then(() => {
          alert("원본 내용으로 복원되었습니다.");
        });
      }
    }

    function copyGrandSummaryText() {
      const textarea = document.getElementById("grandSummaryTextArea");
      if (!textarea) return;
      navigator.clipboard.writeText(textarea.value).then(() => {
        alert("총정리 텍스트가 복사되었습니다!");
      });
    }

    // 상품 설정 및 현재 위치 기록 확장 관리
    function updatePrizeEditorUI(data) {
      const container = document.getElementById('prizeEditorContainer');
      if (!container) return;
      // 상품 목록 입력 폼 렌더링 (현재 위치 포함 기입 가능)
      container.innerHTML = `<p style="font-size:0.85rem; color:#aaa;">게임 종료 후 상품 목록 및 현재 위치(좌표)를 함께 기입할 수 있습니다.</p>`;
    }

    function updateParticipantPrizes(data) {
      const grid = document.getElementById('participantPrizeGrid');
      if (!grid) return;
      grid.innerHTML = `<p style="color:#aaa;">등록된 상품 현황이 없습니다.</p>`;
    }

    function updatePlayerTagsUI(data) {
      const container = document.getElementById('playerTagsContainer');
      if (!container) return;
      const participants = data.participants || {};
      container.innerHTML = Object.keys(participants).map(nick => `
        <div class="player-tag ${data.currentTurnUser === nick ? 'active' : ''}">
          <span>${escapeHtml(nick)}</span>
          <button class="player-btn" onclick="setTurn('${nick}')">턴 지정</button>
        </div>
      `).join('') || '<span style="color:#aaa; font-size:0.85rem;">참가자가 없습니다.</span>';
    }

    function setTurn(nick) {
      db.ref(`rooms/${currentRoom}/currentTurnUser`).set(nick);
    }

    function shuffleCards() {
      if (confirm("카드를 초기화 및 섞으시겠습니까?")) {
        db.ref(`rooms/${currentRoom}/cards`).remove();
        db.ref(`rooms/${currentRoom}/history`).remove();
      }
    }

    function resetAllCardsModal() {
      if (confirm("모든 카드의 오픈 상태를 닫힘으로 초기화하시겠습니까?")) {
        db.ref(`rooms/${currentRoom}/cards`).remove();
      }
    }

    function copyRoomLink() {
      const link = location.origin + location.pathname + '?room=' + currentRoom;
      navigator.clipboard.writeText(link).then(() => {
        alert("방 링크가 복사되었습니다!");
      });
    }

    // 유튜브 및 BGM 제어 함수들
    let player;
    function setBgmUrl() {
      const val = document.getElementById('bgmUrlInput').value.trim();
      if (!val) return;
      let videoId = val;
      if (val.includes('youtu.be/')) {
        videoId = val.split('youtu.be/')[1].split('?')[0];
      } else if (val.includes('watch?v=')) {
        videoId = val.split('watch?v=')[1].split('&')[0];
      }
      document.getElementById('youtubePlayerBox').classList.add('show');
      if (player && typeof player.loadVideoById === 'function') {
        player.loadVideoById(videoId);
      } else {
        window.onYouTubeIframeAPIReady = function() {
          player = new YT.Player('youtubePlayerFrame', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            events: {
              'onReady': (e) => e.target.playVideo()
            }
          });
        };
      }
    }

    function togglePlayBgm() {
      if (player && player.getPlayerState) {
        if (player.getPlayerState() === YT.PlayerState.PLAYING) {
          player.pauseVideo();
          document.getElementById('bgmPlayBtn').textContent = '▶';
        } else {
          player.playVideo();
          document.getElementById('bgmPlayBtn').textContent = '❚❚';
        }
      }
    }

    function stopBgm() {
      if (player && player.stopVideo) {
        player.stopVideo();
        document.getElementById('bgmPlayBtn').textContent = '▶';
      }
    }

    function changeVolume(val) {
      if (player && player.setVolume) {
        player.setVolume(val);
      }
    }

    function closeYoutubePlayer() {
      document.getElementById('youtubePlayerBox').classList.remove('show');
      stopBgm();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
